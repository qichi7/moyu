    const water = neighborsOf(dock.x, dock.y).find(p => tileAt(p.x, p.y) === T.WATER);
    if (!water) { logThrottled("码头旁没有足够的水域停渔船。", 40); return; }
    // 木材安全余量：留 12 木给通路工程（桥/填海优先于渔船，防止工程被造船饿死）
    if (jointStock("wood") < SIM.BOAT_COST + 12) {
      logThrottled("木材不足，无力打造渔船。", 40);
      return;
    }
    jointConsume("wood", SIM.BOAT_COST);
    world.ships.push({
      x: water.x + 0.5, y: water.y + 0.5,
      ang: rand() * Math.PI * 2, sailor: this, state: "fishing",
      boat: true, hold: 0, fishCd: 0, target: pickFishingSpot(dock), revealCd: 0, dist: 0,
    });
    this.state = "voyage";
    this.voyaging = true;
    this.task = null;
    logMsg(`${this.name} 驾着小渔船出海捕鱼了。`);
    return true;
  }

  // 出海远航：造船消耗联合木材，装载粮草做补给，登船后航向未知海域（船逻辑见 world.shipTick）
  startVoyage(dock) {
    const water = neighborsOf(dock.x, dock.y).find(p => tileAt(p.x, p.y) === T.WATER);
    if (!water) { logThrottled("码头旁没有足够的水域停船。", 40); return; }
    // 先探明码头周边水域（点亮生成真实地形，避免朝向落入"VOID 生成后变陆地"的陷阱）
    revealArea(water.x, water.y, 9);
    // 初始朝向：均匀扫描 24 个方位角找前方 3 格开阔的方向（确定性，地理允许即必命中）
    let ang = -1;
    for (let k = 0; k < 24; k++) {
      const tAng = (k / 24) * Math.PI * 2 + rand() * 0.15;
      let open = true;
      for (let d = 1.5; d <= 3; d += 0.5) {
        const t = tileAt(Math.round(water.x + Math.cos(tAng) * d), Math.round(water.y + Math.sin(tAng) * d));
        if (t !== T.VOID && t !== T.DEEP && t !== T.WATER) { open = false; break; }
      }
      if (open) { ang = tAng; break; }
    }
    if (ang < 0) { logThrottled("码头周边水路不畅，远航船无法出港。", 40); return; }
    // 同样留木材安全余量给通路工程
    if (jointStock("wood") < SIM.SHIP_COST + 12) {
      logThrottled("木材不足，无法造船远航。", 40);
      return;
    }
    jointConsume("wood", SIM.SHIP_COST);
    // 装载补给（粮食）：从码头所属城市库存装粮，有多少装多少，不满也出海
    const portCity = ownerSettle(dock.x, dock.y);
    const supply = portCity ? ensureStock(portCity).food : 0;
    const load = Math.min(SIM.SHIP_PROVISION_LOAD, Math.floor(supply));
    if (load < SIM.SHIP_PROVISION_LOAD) {
      logMsg(`${this.name} 的船粮草不满（${load}/${SIM.SHIP_PROVISION_LOAD}），仍执意扬帆出海。`);
    }
    if (portCity) ensureStock(portCity).food -= load;
    world.ships.push({
      x: water.x + 0.5, y: water.y + 0.5,
      ang, sailor: this, state: "sailing",
      prov: load, dist: 0, revealCd: 0,
    });
    this.state = "voyage";
    this.voyaging = true;
    this.task = null;
    logMsg(`航海家 ${this.name} 从码头扬帆出海，驶向未知的海域。`);
  }

  // 探索延伸一腿：从小人当前位置贴身向前点亮（斑块与脚下接壤），然后走向点亮区
  exploreLeg() {
    // 前方 2~5 格处为点亮中心，保证斑块边缘与当前位置接壤
    const dist = 3 + rand() * 3;
    const tx = Math.round(this.x + this.exploring.dx * dist);
    const ty = Math.round(this.y + this.exploring.dy * dist);
    revealArea(tx, ty, randRange(7.5, SIM.REVEAL_RADIUS));
    // 走向点亮区前沿（而非跳过它）
    const stepTo = Math.min(dist, 5);
    const gx = Math.round(this.x + this.exploring.dx * stepTo);
    const gy = Math.round(this.y + this.exploring.dy * stepTo);
    if (this.goTo(gx, gy)) {
      this.state = "walk";
      this.onArrive = () => { this.state = "idle"; };
      return;
    }
    // 前沿走不通（点亮后仍是海/山）→ 尝试侧向一次
    const sx = Math.round(this.x + (this.exploring.dx * 0.7 - this.exploring.dy * 0.7) * dist);
    const sy = Math.round(this.y + (this.exploring.dy * 0.7 + this.exploring.dx * 0.7) * dist);
    revealArea(sx, sy, randRange(4, SIM.REVEAL_RADIUS * 0.7));
    if (this.goTo(sx, sy)) {
      this.state = "walk";
      this.onArrive = () => { this.state = "idle"; };
      return;
    }
    logThrottled("探索者抵达了已知世界的边缘，止步于茫茫大海。", 25);
    this.exploring = null;
    this.state = "idle";
  }

  goSleep() {
    if (this.home && this.goTo(this.home.x, this.home.y)) {
      this.state = "walk";
      this.onArrive = () => { this.state = "sleep"; };
    } else {
      this.state = "sleep"; // 没家，就地睡（心情差点，v1 不建模心情）
    }
  }

  // 最近的进食点：粮仓（含新区粮仓）或任一农田，避免全城挤一个仓
  nearestFoodSpot() {
    return nearestFoodTo(this.x, this.y).spot;
  }

  // 设置去 (tx,ty) 的路径；顺带处理"路被堵"→ 触发移山填海
  goTo(tx, ty) {
    const r = findPath(this.x | 0, this.y | 0, tx, ty);
    if (r && r.path) {
      this.path = r.path; this.pi = 0;
      return true;
    }
    // 不可达：如果挡路的是山/水/树，有概率立项改造（协作修路的来源之一）
    if (r && r.blocked && rand() < 0.6) {
      const b = r.blocked;
      const t = tileAt(b.x, b.y);
      const meta = TILE_META[t];
      if (meta.diggable) {
        // 山/树：单格立项开凿
        const exist = tasks.list.find(k => !k.done && k.x === b.x && k.y === b.y);
        if (!exist) {
          tasksAdd({ type: "DIG", x: b.x, y: b.y });
          logThrottled(`通路受阻：(${b.x},${b.y}) 的${meta.name}挡住了去路，立项改造。`, 15);
        }
      } else if (t === T.WATER || t === T.DEEP) {
        // 跨水：链式桥——立项首格（blocked 必邻工人所站格，必可达），带朝目标方向与剩余步数；
        // 建成后 tasksFinish 沿方向续立下一格（remain 递减到 0 停，桥不无限穿海），
        // 工人跟进过桥，走到新桥头再续——细长桥线直通对岸
        const dup = tasks.list.some(k => !k.done && k.x === b.x && k.y === b.y);
        // 同海峡只架一条桥：25 格内已有桥（在建成线）则不另起炉灶，等它建成即可通行
        if (!dup && !nearAny(b.x, b.y, [T.BRIDGE], 25) && tasksPending("BRIDGE", true).length < 40) {
          tasksAdd({ type: "BRIDGE", x: b.x, y: b.y,
            corridor: { dx: Math.sign(tx - b.x) || 0, dy: Math.sign(ty - b.y) || 0,
              remain: Math.abs(tx - b.x) + Math.abs(ty - b.y) } });
          logThrottled(`通路受阻：(${b.x},${b.y}) 的水域挡住了去路，开始架桥。`, 15);
        }
      } else if (meta.fillable) {
        // 其余可填格（罕见）：兜底单格填平
        if (!tasks.list.some(k => !k.done && k.x === b.x && k.y === b.y)) tasksAdd({ type: "FILL", x: b.x, y: b.y });
      }
    }
    return false;
  }

  // 迁居：放弃旧居，搬到最近进食点旁"还有名额"的房子
  migrate() {
    this.home = null;
    const spot = this.nearestFoodSpot();
    let best = null, bestD = Infinity;
    for (const h of world.houses) {
      const d = Math.abs(h.x - spot.x) + Math.abs(h.y - spot.y);
      const occ = agents.filter(a => a.home && a.home.x === h.x && a.home.y === h.y).length;
      if (d < bestD && occ < 3) { bestD = d; best = h; }
    }
    if (best) this.home = { x: best.x, y: best.y };
    logThrottled("饥民迁居：一批人搬往食物充裕的街区。", 60);
  }

  abandonTask() {
    if (!this.task) return;
    tasksRelease(this.task, this);
    this.task = null;
    this.state = "idle";
  }

  stepAlong(dt) {
    if (!this.path || this.pi >= this.path.length) {
      this.path = null;
      if (this.onArrive) { const f = this.onArrive; this.onArrive = null; f(); }
      else this.state = "idle";
      return;
    }
    const target = this.path[this.pi];
    const gx = target.x + 0.5, gy = target.y + 0.5;
    const dx = gx - this.x, dy = gy - this.y;
    const dist = Math.hypot(dx, dy);
    const step = this.speed * dt;
    if (dist <= step) {
      this.x = gx; this.y = gy;
      this.pi++;
    } else {
      this.x += (dx / dist) * step;
      this.y += (dy / dist) * step;
    }
  }

  doWork(dt) {
    const t = this.task;
    if (!t) { this.state = "idle"; return; }
    if (t.done) { this.task = null; this.state = "idle"; return; }   // 任务已被其他工人完成（防御网）

    // 狩猎/捕获：猎物会跑，实时追踪；猎物消失则任务作废
    // 水生猎物（鱼群）不追踪——渔人守在立项给的岸边格，圈养水域由任务结算处理
    let gx = t.x, gy = t.y, chaseR = 2.2;
    if (t.creature) {
      if (t.creature.dead) { this.abandonTask(); return; }
      const waterPrey = CREATURE_META[t.creature.type].habitat === "water";
      if (!waterPrey) {
        gx = t.creature.x - 0.5; gy = t.creature.y - 0.5;
        chaseR = 5;
        const d = Math.hypot(gx + 0.5 - this.x, gy + 0.5 - this.y);
        if (d > 6) {
          if (this.goTo(Math.round(gx), Math.round(gy))) { this.state = "walk"; this.onArrive = () => { this.state = "work"; }; }
          else this.abandonTask();
          return;
        }
      }
    }
    const d = Math.abs((gx + 0.5) - this.x) + Math.abs((gy + 0.5) - this.y);
    if (d > chaseR) {
      if (this.goTo(gx, gy)) { this.state = "walk"; this.onArrive = () => { this.state = "work"; }; }
      else this.abandonTask();
      return;
    }
    // 干活：建造类推进任务进度；改造类直接磨 tile 血量（勤劳的人手快）
    let effort = SIM.WORK_EFFORT * (0.7 + this.diligence * 0.6) * dt;
    // 猎犬助阵：主人狩猎且随行狗在 6 格内 → 效率 ×1.5
    if (t.type === "HUNT") {
      for (const c of creatures) {
        if (c.type === "dog" && !c.dead && Math.hypot(c.x - this.x, c.y - this.y) < 6) {
          effort *= 1.5;
          logThrottled("猎犬紧紧咬住猎物的退路，狩猎顺利多了。", 40);
          break;
        }
      }
    }
    // 工程资源检查：架桥耗木材、造陆耗沙土（联合库存，跨聚落汇总），不足则挂起等补给
    if (t.type === "BRIDGE" || t.type === "FILL") {
      const cost = TASK_RESOURCE_COST[t.type];
      const res = Object.keys(cost)[0];
      if (jointStock(res) < cost[res]) {
        logThrottled(`${res === "wood" ? "木材" : "沙土"}不足，工程暂停等待补给。`, 30);
        return;
      }
      t.progress += effort;
      if (t.progress >= (t.need || 0)) {
        jointConsume(res, cost[res]);   // 完工结算资源
        this.task = null;
        tasksFinish(t);
        this.state = "idle";
      }
      this.energy -= SIM.ENERGY_DECAY * dt * 0.5;
      return;
    }
    if (t.type === "DIG") {
      // 伐木/采石：磨 tile 血量，产出由工人搬运回仓
      const r = workTile(t, effort);
      if (r && r.done) {
        const y = tasksFinish(t, this, r.was);   // 完成任务，传入改造前 tile 判定产出
        this.task = null;
        this.state = "idle";
        if (y) {
          this.carrying = y;
          this.state = "idle";           // 下一轮决策将回仓入库
        }
      }
    } else {
      // 其余任务一律进度制（建造/农牧/畜牧/采集/狩猎等），防止无出口的假 workTile 卡死
      t.progress += effort;
      if (t.progress >= t.need) {
        const y = tasksFinish(t, this);   // 完成任务，取得搬运产出
        this.task = null;
        this.state = "idle";
        if (y) {
          this.carrying = y;
          this.state = "idle";           // 下一轮决策将回仓入库
        }
      }
    }
    this.energy -= SIM.ENERGY_DECAY * dt * 0.5;
  }
}

// 螺旋向外找最近的前沿格：可站立陆地且 4 邻含 VOID（探索者的目标点；只扫局部，成本受 maxR 约束）
function findFrontier(cx, cy, maxR) {
  for (let r = 1; r <= maxR; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;   // 只扫当前圈
        const x = cx + dx, y = cy + dy;
        if (!walkable(x, y)) continue;
        if (neighborsOf(x, y).some(p => tileAt(p.x, p.y) === T.VOID)) return { x, y };
      }
    }
  }
  return null;
}

// 从 (x,y) 的连通浅水格数（只走 WATER）是否 ≤cap——小池塘不需要架桥
function waterRegionSmall(x, y, cap) {
  const seen = new Set([x + "," + y]);
  const q = [[x, y]];
  let count = 1;
  while (q.length) {
    const [cx, cy] = q.pop();
    for (const p of neighborsOf(cx, cy)) {
      const k = p.x + "," + p.y;
      if (seen.has(k)) continue;
      if (tileAt(p.x, p.y) !== T.WATER) continue;
      seen.add(k); count++;
      if (count > cap) return false;
      q.push([p.x, p.y]);
    }
  }
  return true;
}

function isDaytime() {
  return world.timeOfDay > SIM.NIGHT_END && world.timeOfDay < SIM.NIGHT_START;
}

// 节流日志：同类消息 minGap（sim 秒）内只发一次
const _logLast = {};
function logThrottled(text, minGap) {
  const now = world.time;
  const gap = minGap || 30;
  if (_logLast[text] !== undefined && now - _logLast[text] < gap) return;
  _logLast[text] = now;
  logMsg(text);
}


"use strict";
// ============ 模拟调度：出生 / 规划器（需求聚合） / 主更新 ============

const agents = [];

function spawnAgent(x, y, native) {
  const a = new Agent(x, y, native);
  agents.push(a);
  return a;
}

// 发现岛上的原住民部落：友好相遇，帮他们盖第一座居所，并纳入世界体系
onEvent("discovery", isl => {
  carveRiver(isl);                                 // 显现的岛可能带河流
  populateIslandCreatures(Math.round(isl.x), Math.round(isl.y), Math.ceil(isl.r));   // 岛上兽群
  if (rand() >= 0.6) return;                       // 60% 的发现岛有原住民
  let born = 0;
  for (let i = 0; i < 30 && born < 2 + randInt(0, 2); i++) {
    const spot = findSpot(Math.round(isl.x), Math.round(isl.y), 0, Math.max(3, isl.r), T.GRASS);
    if (spot) { spawnAgent(spot.x, spot.y, true); born++; }
  }
  if (!born) return;
  const s = findSpot(Math.round(isl.x), Math.round(isl.y), 2, Math.max(5, isl.r), T.GRASS);
  if (s) tasksAdd({ type: "BUILD", x: s.x, y: s.y, need: 10 });
  logMsg(`探险队与远方原住民部落友好相遇（${born} 人），并为他们筹划第一座居所。`);
});

// 全局：离 (x,y) 最近的进食点（主粮仓 + 新区粮仓 + 农田）
// exclude: 排除与该坐标重合的粮仓（测锚点自身缺粮程度时用）
function nearestFoodTo(x, y, exclude) {
  let best = world.store;
  let bestD = Math.abs(world.store.x - x) + Math.abs(world.store.y - y);
  const consider = (px, py) => {
    if (exclude && px === exclude.x && py === exclude.y) return;
    const d = Math.abs(px - x) + Math.abs(py - y);
    if (d < bestD) { bestD = d; best = { x: px, y: py }; }
  };
  for (const f of world.farms) consider(f.x, f.y);
  for (const h of world.houses) {
    if (!h.granary) continue;
    consider(h.x, h.y);
  }
  return { spot: best, dist: bestD };
}

// 一群点的重心
function centroidOf(list) {
  if (!list.length) return null;
  let sx = 0, sy = 0;
  for (const a of list) { sx += a.x; sy += a.y; }
  return { x: sx / list.length, y: sy / list.length };
}

// 给无房小人分配房屋（一房三户，与"房屋容量 = 房数×3"的口径一致）
// 评分 = 离人距离×0.3 + 离食物距离 + 地区人口密度倾向：
//   探索型居民（先锋者）偏好人口少的地区（向往边疆），恋家者偏好人口多的成熟社区
function assignHomes() {
  const count = {};
  const key = h => `${h.x},${h.y}`;
  for (const a of agents) {
    if (a.home) count[key(a.home)] = (count[key(a.home)] || 0) + 1;
  }
  for (const a of agents) {
    if (a.home) continue;
    const pioneer = a.hobby === "explore" || a.adventure > 0.6;
    let best = null, bestScore = Infinity, bestKey = null;
    for (const h of world.houses) {
      const k = key(h);
      if ((count[k] || 0) >= 3) continue;
      const food = nearestFoodTo(h.x, h.y).dist;
      // 该房的当前住户数即拥挤度信号
      const crowd = count[k] || 0;
      const crowdTerm = pioneer ? -crowd * 1.2 : crowd * 0.5;
      const score = (Math.abs(h.x - a.x) + Math.abs(h.y - a.y)) * 0.3 + food + crowdTerm;
      if (score < bestScore) { bestScore = score; best = h; bestKey = k; }
    }
    if (best) {
      a.home = { x: best.x, y: best.y };
      count[bestKey] = (count[bestKey] || 0) + 1;
    }
  }
}

// 选址锚点：主粮仓 + 各新区粮仓。建筑围绕各自的生活区生长，不再全部挤在出生点
function pickAnchor() {
  const anchors = [world.store];
  for (const h of world.houses) {
    if (h.granary && !(h.x === world.store.x && h.y === world.store.y)) anchors.push(h);
  }
  return anchors[randInt(0, anchors.length - 1)];
}

// ---- 规划器：聚合小人状态 → 触发世界变化 ----
// 距 (x,y) 最近的同类设施（聚簇基准点）
function nearestOf(list, p) {
  let best = null, bd = 1e9;
  for (const o of list) {
    const d = Math.abs(o.x - p.x) + Math.abs(o.y - p.y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// 同聚落内的设施列表（聚簇只在区内进行——用户需求：不同地区之间不需要聚集）
// 归属判定用无半径最近聚落（设施选址半径可大于 SETTLEMENT_RADIUS，nearestSettlement 会误判为无主）
function localFacilities(list, settle) {
  if (!settle) return list;
  return list.filter(o => ownerSettle(o.x, o.y) === settle);
}
function plannerTick() {
  const pop = agents.length;
  const homeless = agents.filter(a => !a.home).length;

  // 1. 住房前瞻：容量余量不足（或已有人无家）→ 建房；选址失败说明本区
  //    已无立足之地 → 直接开辟新区。房屋富余（够住且多 3 间以上）则不新建
  //    闸门只统计"还在正常推进"的任务，冻结任务不算数，防止堵死建房通道；
  //    无家者超过 6 人时无视账面容量富余，强制补建（孤立地段的房不算有效容量）
  //    选址偏好：同聚落内房子聚簇（新屋挨着已有房屋 3 格内，房间距防贴脸），跨聚落不要求
  const capacity = world.houses.length * 3;
  if ((homeless > 6 || capacity - pop <= 2) && capacity <= pop + 8 && tasksPending("BUILD", true).length < 3) {
    // 锚点优先：有居住区划的聚落 → 居住区（区内也聚簇：新屋挨已有房屋）；再无家者重心；再粮仓锚点
    let s = null;
    for (const st of world.settlements) {
      if (!st.zones) continue;
      const z = st.zones.find(z => z.type === "housing");
      if (z) {
        const ref = nearestOf(localFacilities(world.houses, st), z);
        s = (ref && expandSpot(ref, 2, 6, T.GRASS)) ||
            findSpot(z.x, z.y, 0, z.r, T.GRASS);
        if (s) break;
      }
    }
    if (!s) {
      const c = centroidOf(agents.filter(a => !a.home));
      const anchor = c || pickAnchor();
      const ref = nearestOf(localFacilities(world.houses, nearestSettlement(anchor.x, anchor.y)), anchor);
      s = (ref && expandSpot(ref, 2, 6, T.GRASS)) ||
          (c && findSpot(c.x | 0, c.y | 0, 2, 14, T.GRASS)) ||
          findSpot(anchor.x, anchor.y, 3, 18, T.GRASS);
    }
    if (s) {
      tasksAdd({ type: "BUILD", x: s.x, y: s.y, need: 14 });
      logThrottled(`规划署：${homeless} 人无家可归，批准在 (${s.x},${s.y}) 兴建新居。`, 10);
    } else {
      logMsg(`规划署：本区已无建房空间，人口压力迫使向外开辟疆土。`);
      expand();
      return;
    }
  }

  // 2. 粮食压力 → 多渠道补粮：农田 / 浆果采集 / 狩猎 / 畜牧（城邦解锁）
  //    选址偏好：同聚落内农田连片（新田挨着已有农田 3 格内，田可紧贴成片），跨聚落不要求
  if (world.farms.length * 6 < pop + 8 && tasksPending("FARM", true).length < 2) {
    let s = null;
    for (const st of world.settlements) {
      if (!st.zones) continue;
      const z = st.zones.find(z => z.type === "farm");
      if (z) {
        const ref = nearestOf(localFacilities(world.farms, st), z);
        s = (ref && expandSpot(ref, 1, 6, T.GRASS)) ||
            findSpot(z.x, z.y, 0, z.r, T.GRASS, [T.HOUSE, T.SITE]);
        if (s) break;
      }
    }
    if (!s) {
      const starving = agents.filter(a => a.hunger < 40);
      const c = starving.length >= 3 ? centroidOf(starving) : null;
      const anchor = c || pickAnchor();
      const ref = nearestOf(localFacilities(world.farms, nearestSettlement(anchor.x, anchor.y)), anchor);
      s = (ref && expandSpot(ref, 1, 6, T.GRASS)) ||
          findSpot(anchor.x, anchor.y, c ? 3 : 4, c ? 16 : 26, T.GRASS, [T.HOUSE, T.SITE]);
    }
    if (s) {
      // 灌溉约束：农田 5 格内需有水（海/塘均可）；选址无水 → 先挖塘引水
      // 挖塘方向性：向最近水源的水缘挖（塘从天然水"长"向农田，连片不零散）；无水可依才贴田独立挖
      if (nearAny(s.x, s.y, [T.WATER, T.DEEP], 5)) {
        tasksAdd({ type: "FARM", x: s.x, y: s.y, need: 9 });
        logThrottled(`规划署：粮食储备吃紧（${Math.floor(totalFood())}），批准开垦 (${s.x},${s.y})。`, 10);
      } else if (tasksPending("EXCAV", true).length < 1) {
        // 找最近水源：以农田为心螺旋 30 格
        let water = null;
        outerW:
        for (let r = 6; r <= 30; r++) {
          for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
            if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
            const t2 = tileAt(s.x + dx, s.y + dy);
            if (t2 === T.WATER || t2 === T.DEEP) { water = { x: s.x + dx, y: s.y + dy }; break outerW; }
          }
        }
        // 水缘朝农田侧挖（贴着天然水连片）；无水才贴田独立挖
        const pond = (water && findPondSpot(water, 4)) ||
                     (water && findPondSpot(s, 6)) ||
                     expandSpot(s, 2, 6, T.GRASS, new Set()) ||
                     findSpot(s.x, s.y, 2, 5, T.GRASS, [T.FARM, T.HOUSE]);
        if (pond) {
          tasksAdd({ type: "EXCAV", x: pond.x, y: pond.y, need: 8 });
          logThrottled(`规划署：新农田远离水源，先在 (${pond.x},${pond.y}) 挖塘引水。`, 20);
        } else {
          tasksAdd({ type: "FARM", x: s.x, y: s.y, need: 9 });   // 无处挖塘：照旧建田（等世界变化）
        }
      }
      // 已有 EXCAV 在挖：暂缓建田（水到渠成）
    }
  }
  // 2b. 采集：附近有果量充足的浆果丛/果树 → 采集队
  if (totalFood() < 60 + pop * 3 && tasksPending("GATHER", true).length < 2) {
    for (const [k, v] of world.berryStock) {
      if (v < 2) continue;
      const [bx, by] = k.split(",").map(Number);
      const a = pickAnchor();
      if (Math.abs(bx - a.x) + Math.abs(by - a.y) < 26 && tileAt(bx, by) !== T.VOID) {
        tasksAdd({ type: "GATHER", x: bx, y: by, need: 4 });
        break;
      }
    }
  }
  // 2c. 狩猎：附近有野生牛羊 → 猎队（立项前确认动物存活，且未被捕获任务占用）
  if (totalFood() < 60 + pop * 3 && tasksPending("HUNT", true).length < 1) {
    const a = pickAnchor();
    const wild = creatures.filter(c => c.isWild() && !c.dead && CREATURE_META[c.type].hunt &&
      Math.abs(c.x - a.x) + Math.abs(c.y - a.y) < 30 && !tasks.list.some(k => k.creature === c && !k.done));
    if (wild.length) {
      const c = wild[0];
      tasksAdd({ type: "HUNT", x: Math.round(c.x - 0.5), y: Math.round(c.y - 0.5), creature: c });
    }
  }
  // 兜底清理：猎物已死的 HUNT/CAPTURE 任务立即移除（否则永久占位阻塞该物种新立项）
  for (let i = tasks.list.length - 1; i >= 0; i--) {
    const t = tasks.list[i];
    if ((t.type === "HUNT" || t.type === "CAPTURE") && t.creature && t.creature.dead) {
      for (const w of t.workers) { if (w.task === t) { w.task = null; if (w.state === "walk" || w.state === "work") w.state = "idle"; } }
      tasks.list.splice(i, 1);
    }
  }
  // 2d. 畜牧（开局解锁：驯化早于定居文明）：无牧场 → 建牧场；有牧场有空位且附近有野生牲畜 → 捕获
  if (world.era >= 0) {
    if (world.pastures.length === 0 && tasksPending("PASTURE", true).length < 1) {
      const a = pickAnchor();
      const s = findSpot(a.x, a.y, 4, 14, T.GRASS);
      if (s) tasksAdd({ type: "PASTURE", x: s.x, y: s.y, need: 16 });
    } else if (world.pastures.length > 0 && tasksPending("CAPTURE", true).length < 1) {
      const pas = world.pastures[0];
      const cap = creatures.filter(c => c.isWild() && !c.dead &&
        Math.hypot(c.x - pas.x, c.y - pas.y) < 40 && c.type !== "dog" &&
        creatures.filter(k => k.pasture && k.type === c.type).length < SIM.PASTURE_CAP);
      if (cap.length) {
        const c = cap[0];
        tasksAdd({ type: "CAPTURE", x: Math.round(c.x - 0.5), y: Math.round(c.y - 0.5), creature: c, pasture: pas });
      }
    }
  }
  // 2d2. 渔场：圈养鱼群不足 → 三级策略
  //      ① 近岸有野生鱼群 → 原地圈养（水域即渔场，无需建筑）
  //      ② 无近岸鱼群但聚落近处有水域 → 从远处野生鱼群捕苗运来圈养（dest 指定水域）
  //      ③ 连可用的水域都没有 → 先挖塘（EXCAV，塘成后回到②）
  if (tasksPending("CAPTURE", true).length < 1 &&
      creatures.filter(c => c.pasture && c.type === "fish" && !c.dead).length < SIM.PASTURE_CAP) {
    const a = pickAnchor();
    const wild = creatures.filter(c => c.isWild() && !c.dead && c.type === "fish" &&
      !tasks.list.some(k => k.creature === c && !k.done));
    let placed = false;
    // ① 原地圈养
    for (const f of wild) {
      const fx = Math.round(f.x - 0.5), fy = Math.round(f.y - 0.5);
      if (Math.abs(fx - a.x) + Math.abs(fy - a.y) > 30) continue;
      const shore = neighborsOf(fx, fy).find(p => walkable(p.x, p.y));
      if (shore) {
        tasksAdd({ type: "CAPTURE", x: shore.x, y: shore.y, need: 5, creature: f, pasture: { x: fx, y: fy } });
        placed = true;
        break;
      }
    }
    // ② 运鱼到聚落近处水域
    if (!placed) {
      const dest = findSpot(a.x, a.y, 4, 18, T.WATER, [T.DOCK]);
      if (dest && wild.length && !creatures.some(c => c.pasture && c.type === "fish" &&
          Math.abs(c.pasture.x - dest.x) + Math.abs(c.pasture.y - dest.y) < 3)) {
        const seed = wild[0];
        const sx = Math.round(seed.x - 0.5), sy = Math.round(seed.y - 0.5);
        const shore = neighborsOf(sx, sy).find(p => walkable(p.x, p.y));
        if (shore) {
          tasksAdd({ type: "CAPTURE", x: shore.x, y: shore.y, need: 5, creature: seed,
            pasture: { x: sx, y: sy }, dest: { x: dest.x, y: dest.y } });
          logThrottled("渔人打算捕些鱼苗，送到近处的水域里放养。", 30);
          placed = true;
        }
      }
    }
    // ③ 挖塘：聚簇选址（连击优先贴上次的塘，其次贴天然水，最后独立）
    if (!placed && tasksPending("EXCAV", true).length < 1) {
      const pond = (_lastPond && expandSpot(_lastPond, 1, 6, T.GRASS, new Set())) ||
                   findPondSpot(a, 12) ||
                   findSpot(a.x, a.y, 3, 12, T.GRASS, [T.FARM, T.HOUSE]);
      if (pond) {
        tasksAdd({ type: "EXCAV", x: pond.x, y: pond.y, need: 8 });
        logThrottled("规划署：近处没有可养鱼的水域，先挖一口鱼塘。", 30);
      }
    }
  }
  // 2e. 资源采集：各聚落木材/石材/沙土低于阈值 → 立项伐木/采石/采沙/植树
  for (const s of world.settlements) {
    const stock = ensureStock(s);
    const digPending = type => tasksPending("DIG", true).filter(t => t.res === type).length;
    if (stock.wood < 25 && digPending("wood") < 6) {   // 储备线 25：造船消耗大，伐木要跑在前面
      const t = findSpot(s.x, s.y, 2, 30, T.TREE);
      if (t) tasksAdd({ type: "DIG", x: t.x, y: t.y, res: "wood" });
    }
    if (stock.stone < 8 && digPending("stone") < 1) {
      const t = findSpot(s.x, s.y, 2, 18, T.MOUNTAIN);
      if (t) tasksAdd({ type: "DIG", x: t.x, y: t.y, res: "stone" });
    }
    if (stock.sand < 6 && tasksPending("GATHER", true).filter(t => t.res === "sand").length < 3) {
      const t = findSpot(s.x, s.y, 2, 18, T.SAND);
      if (t) tasksAdd({ type: "GATHER", x: t.x, y: t.y, need: 4, res: "sand" });
    }
    if (stock.wood < 15 && tasksPending("PLANT", true).length < 2) {
      const t = findSpot(s.x, s.y, 3, 12, T.GRASS);
      if (t) tasksAdd({ type: "PLANT", x: t.x, y: t.y, need: 4 });
    }
  }
  // 2e2. 码头（定居时代解锁）：临水草地建码头，开启航海时代
  if (world.era >= 1 && world.docks.length === 0 && tasksPending("DOCK", true).length < 1) {
    for (const s of world.settlements) {
      const shore = findSpot(s.x, s.y, 3, 26, T.GRASS, [T.DOCK]);
      if (shore && neighborsOf(shore.x, shore.y).some(p => tileAt(p.x, p.y) === T.WATER)) {
        tasksAdd({ type: "DOCK", x: shore.x, y: shore.y, need: 20 });
        break;
      }
      // 找不到临水格 → 聚落 30 格内找浅水邻格的草地
      let placed = false;
      for (let tries = 0; tries < 100 && !placed; tries++) {
        const cx = s.x + randInt(-30, 30), cy = s.y + randInt(-30, 30);
        if (tileAt(cx, cy) !== T.GRASS) continue;
        if (neighborsOf(cx, cy).some(p => tileAt(p.x, p.y) === T.WATER)) {
          tasksAdd({ type: "DOCK", x: cx, y: cy, need: 20 });
          placed = true;
        }
      }
      if (placed) break;
    }
  }
  // 不可再生资源的替代渠道（城邦解锁）：洞穴旁建采石场、河滩建沙场
  if (world.era >= 2) {
    for (const s of world.settlements) {
      if (world.quarries.length < 2 && tasksPending("QUARRY", true).length < 1) {
        const cave = world.caves.find(cv => Math.abs(cv.x - s.x) + Math.abs(cv.y - s.y) < 60 &&
          !world.quarries.some(q => Math.abs(q.x - cv.x) + Math.abs(q.y - cv.y) < 8));
        if (cave) {
          const spot = neighborsOf(cave.x, cave.y).find(p => walkable(p.x, p.y));
          if (spot) tasksAdd({ type: "QUARRY", x: spot.x, y: spot.y, need: 18 });
        }
      }
      if (world.sandpits.length < 3 && tasksPending("SANDPIT", true).length < 1) {
        const shore = findSpot(s.x, s.y, 2, 30, T.SAND, [T.QUARRY, T.SANDPIT]);
        if (shore && neighborsOf(shore.x, shore.y).some(p => tileAt(p.x, p.y) === T.WATER)) {
          tasksAdd({ type: "SANDPIT", x: shore.x, y: shore.y, need: 12 });
        }
      }
    }
  }
  // 2g. 浆果可持续：丛数低于人口需求（且有丛可采种）→ 培育新丛
  const berryTotal = world.berryStock.size;
  const berryHealthy = [...world.berryStock.values()].filter(v => v >= 1).length;
  if ((berryTotal < 6 + Math.floor(pop / 4) || berryHealthy < 3) && tasksPending("PLANT_BERRY", true).length < 2) {
    const seedFrom = [...world.berryStock.entries()].find(([k, v]) => v >= 1);
    if (seedFrom) {
      for (const s of world.settlements) {
        const spot = findSpot(s.x, s.y, 4, 18, T.GRASS, [T.BERRY, T.FRUIT]);
        if (spot && !nearAny(spot.x, spot.y, [T.BERRY, T.FRUIT], 3)) {
          tasksAdd({ type: "PLANT_BERRY", x: spot.x, y: spot.y, need: 5 });
          const [sx, sy] = seedFrom[0].split(",").map(Number);
          gatherBerry(sx, sy);   // 从现有丛取一份做种（有损耗，种植是投资）
          break;
        }
      }
    }
  }
  // 2h. 捕鱼：食物压力且有近海鱼群（海岸可站立）
  if (totalFood() < 60 + pop * 3 && tasksPending("FISH", true).length < 2) {
    const a = pickAnchor();
    for (const [k, v] of world.fishStock) {
      if (v < 2) continue;
      const [fx, fy] = k.split(",").map(Number);
      if (Math.abs(fx - a.x) + Math.abs(fy - a.y) > 26) continue;
      const shore = neighborsOf(fx, fy).find(p => walkable(p.x, p.y));
      if (shore && !tasks.list.some(t => !t.done && t.type === "FISH" && t.fishX === fx && t.fishY === fy)) {
        tasksAdd({ type: "FISH", x: shore.x, y: shore.y, need: 5, fishX: fx, fishY: fy });
        break;
      }
    }
  }

  // 2h2. 渔船：有码头且海上有鱼群 → 渔民驾小渔船近海捕捞（渔获回港入粮池；渔民休整后才再出港）
  if (world.era >= 1 && world.docks.length &&
      world.ships.filter(s => s.boat).length < SIM.FISHING_BOAT_CAP &&
      world.fishStock.size > 0) {
    const fisher = agents.find(x => !x.dead && !x.task && !x.voyaging && !x.rescuing &&
      (x.hobby === "fishing" || x.job === "fisher") &&
      (!x.boatRestT || world.time > x.boatRestT));
    if (fisher) {
      const dock = world.docks.reduce((b, d) =>
        !b || Math.abs(d.x - fisher.x) + Math.abs(d.y - fisher.y) < Math.abs(b.x - fisher.x) + Math.abs(b.y - fisher.y) ? d : b, null);
      if (dock && fisher.goTo(dock.x, dock.y)) {
        fisher.state = "walk";
        fisher.onArrive = () => fisher.startFishingTrip(dock);
      }
    }
  }

  // 2h3. 探索者边疆拓殖：探索者的家随前沿迁移（每 30s 检查一次），前沿旁无房则立项建房——城市向星空生长
  if (world.time - (_frontierCd || -999) > 30) {
    _frontierCd = world.time;
    for (const e of agents.filter(a => !a.dead && a.job === "explorer" && a.home && !a.voyaging)) {
      const front = findFrontier(e.home.x | 0, e.home.y | 0, 60);
      if (!front) continue;
      const dHome = Math.abs(front.x - e.home.x) + Math.abs(front.y - e.home.y);
      if (dHome <= 50) continue;   // 家离前沿足够近
      // 前沿附近找已有房子迁居
      const nearHouse = world.houses.find(h => Math.abs(h.x - front.x) + Math.abs(h.y - front.y) < 15 &&
        !agents.some(a2 => !a2.dead && a2 !== e && a2.home === h));
      if (nearHouse) {
        e.home = { x: nearHouse.x, y: nearHouse.y };
        logMsg(`探索者 ${e.name} 把家搬到了边疆，离世界边界更近了。`);
      } else if (!tasks.list.some(k => !k.done && k.type === "BUILD" &&
          Math.abs(k.x - front.x) + Math.abs(k.y - front.y) < 12)) {
        // 前沿旁无房：立项边疆新居（不与其他建房任务挤在一起）
        const spot = expandSpot(front, 2, 8, T.GRASS, new Set()) || findSpot(front.x, front.y, 2, 8, T.GRASS);
        if (spot) {
          tasksAdd({ type: "BUILD", x: spot.x, y: spot.y, need: 14 });
          logMsg(`边疆营帐：探索者的新居将立在前沿 (${spot.x},${spot.y}) 旁。`);
        }
      }
    }
  }

  // 3. 饥荒告警（一天最多提醒一次，避免刷屏）
  const days = totalFood() / Math.max(1, pop * 0.9);
  if (days < 1 && pop > 0) { logThrottled(`饥荒告警：存粮仅够 ${days.toFixed(1)} 天！`, SIM.DAY_LEN); emit("famine"); }

  // 4. 人口自然增长：由农田承载余量驱动（田先于人到位），饥荒期停止生育
  //    出生安全垫随人口放大（food > 100 + 人口×4），防止出生率超过承载力引发饿死潮
  //    BIRTH_CHECK 是每秒概率，规划器每 PLANNER_INTERVAL 秒才判一次，需换算成窗口概率
  const hasRoom = world.houses.length * 3 > pop;
  if (pop > 0 && totalFood() > 40 && world.farms.length * 5 >= pop + 4 && hasRoom && rand() < SIM.BIRTH_CHECK * SIM.PLANNER_INTERVAL) {
    const near = findBirthSpot();
    const birthCity = near && ownerSettle(near.x, near.y);
    if (near && birthCity && ensureStock(birthCity).food < 12) { /* 出生城市存粮不足：暂缓生育 */ }
    else if (near) {
      const baby = spawnAgent(near.x, near.y);
      baby.age = 0;   // 新生儿从 0 岁长大（1 游戏年 = 1 岁）
      logThrottled(`新生命降临，人口达到 ${pop + 1}。`, 8);
      emit("birth");
    }
  }

  // 5. 疆土随人口生长：每增长约 25 人，规划署主动开辟一片新疆土（无人口上限）
  if (pop >= (world.expansions + 1) * 20) {   // 每 20 人生长一次疆土
    expand();
  }

  // 6. 冻结任务自愈：冻结超 60 秒的**开凿**工程，自动把周围 2 格同类障碍补成立项（山地走廊保留宽度机制）。
  //    FILL/BRIDGE 不参与扩散：跨水通路由 goTo 的连续水段桥线一次成型（1 格宽细桥，不再菱形铺沙）。
  //    建造/填海类任务累计冻结 180 秒仍无法施工 → 放弃（填海恢复为水），释放名额
  for (let i = tasks.list.length - 1; i >= 0; i--) {
    const t = tasks.list[i];
    if ((t.blockedCount || 0) < 3) continue;
    t.freezeAge = (t.freezeAge || 0) + SIM.PLANNER_INTERVAL;

    if (t.freezeAge >= 180 && (t.type === "BUILD" || t.type === "FARM" || t.type === "FILL")) {
      setTile(t.x, t.y, t.type === "FILL" ? T.WATER : T.GRASS);   // 填海放弃恢复为水
      tasks.list.splice(i, 1);
      logThrottled("规划署放弃了一处无法施工的地块。", 60);
      continue;
    }
    if (t.freezeAge < 60) continue;
    t.freezeAge = 0;
    t.blockedCount = 0;
    if (t.type !== "DIG") continue;   // 只有开凿需要横向扩宽（凹形山壁卡死），水路已改用桥线
    for (let dy2 = -2; dy2 <= 2; dy2++) {
      for (let dx2 = -2; dx2 <= 2; dx2++) {
        const nx2 = t.x + dx2, ny2 = t.y + dy2;
        const meta2 = TILE_META[tileAt(nx2, ny2)];
        if (meta2.diggable && !tasks.list.some(k => !k.done && k.x === nx2 && k.y === ny2)) {
          tasksAdd({ type: "DIG", x: nx2, y: ny2 });
        }
      }
    }
  }

  // 7. 丰收宴席：存粮远超需求时全城共食（每 3 天最多一次），富余粮食有了出口
  if (pop > 0 && totalFood() > 60 + pop * 5 && world.time - _lastFeast > SIM.DAY_LEN * 3) {
    // 宴席消耗由存粮最多的城市承担
    const rich = world.settlements.slice().sort((a, b) => (b.stock ? b.stock.food || 0 : 0) - (a.stock ? a.stock.food || 0 : 0))[0];
    if (rich) ensureStock(rich).food = Math.max(0, ensureStock(rich).food - (40 + pop));
    _lastFeast = world.time;
    for (const a of agents) { a.hunger = 100; a.energy = Math.min(100, a.energy + 30); }
    logMsg("丰收宴席：全城共食，欢声笑语。");
    emit("feast");
  }

  // 8. 聚落发展：繁荣度 = 辖区内房×3 + 田×2；达到分数线升级为 村庄/城镇/城市
  for (const s of world.settlements) {
    let score = 0;
    for (const h of world.houses) {
      if (Math.abs(h.x - s.x) + Math.abs(h.y - s.y) <= SIM.SETTLEMENT_RADIUS) score += 3;
    }
    for (const f of world.farms) {
      if (Math.abs(f.x - s.x) + Math.abs(f.y - s.y) <= SIM.SETTLEMENT_RADIUS) score += 2;
    }
    const lv = score >= SIM.SETTLEMENT_SCORE[2] ? 3
             : score >= SIM.SETTLEMENT_SCORE[1] ? 2
             : score >= SIM.SETTLEMENT_SCORE[0] ? 1 : 0;
    if (lv > s.level) {
      s.level = lv;
      const title = ["定居点", "村庄", "城镇", "城市"][lv];
      logMsg(`「${s.name}」繁荣兴盛，升级为${title}。`);
      emit("settlement-up");
      if (lv >= 2) {
        // 城邦时代：划定功能区（农业区/居住区/市中心），后续选址向对应分区倾斜
        const a = rand() * Math.PI * 2;
        s.zones = [
          { type: "farm", x: Math.round(s.x + Math.cos(a) * 9), y: Math.round(s.y + Math.sin(a) * 9), r: 6 },
          { type: "housing", x: Math.round(s.x + Math.cos(a + Math.PI) * 8), y: Math.round(s.y + Math.sin(a + Math.PI) * 8), r: 6 },
          { type: "market", x: s.x, y: s.y, r: 4 },
        ];
        world.zonesVersion = (world.zonesVersion || 0) + 1;
        logMsg(`「${s.name}」划定功能区：农业区、居住区与市中心。`);
        buildTownRoads(s);
      }
      if (lv >= 3) {
        // 文明时代：在居住区兴建高层住宅社区
        const z = s.zones && s.zones.find(z => z.type === "housing");
        const base = z ? findSpot(z.x, z.y, 0, z.r, T.GRASS) : null;
        if (base) {
          let built = 0;
          for (let dx = 0; dx < 3; dx++) {
            if (tileAt(base.x + dx, base.y) === T.GRASS) {
              tasksAdd({ type: "BUILD", x: base.x + dx, y: base.y, need: 12, floors: 3 });
              built++;
            }
          }
          if (built) logMsg(`「${s.name}」兴建高层住宅社区（${built} 栋高楼）。`);
        }
      }
    }
  }

  // 9. 时代演进：文明整体迈入新纪元
  eraCheck(pop);

  // 10. 劳动力市场：职业随需求流转（没活干会转行）
  jobMarketTick(pop);

  assignHomes();
}

function freeNeighbor(x, y) {
  const c = neighborsOf(x, y).filter(p => walkable(p.x, p.y));
  return c.length ? c[randInt(0, c.length - 1)] : null;
}

// 时代演进：按最高聚落等级与人口里程碑判定（见 config.ERAS）
function eraCheck(pop) {
  let target = 0;
  const maxLevel = world.settlements.reduce((m, s) => Math.max(m, s.level), 0);
  if (maxLevel >= 1) target = 1;
  if (maxLevel >= 2) target = 2;
  if (maxLevel >= 3) target = 3;
  if (pop >= 150 && world.settlements.filter(s => s.level >= 3).length >= 2) target = 4;
  if (target > world.era) {
    world.era = target;
    logMsg(`文明迈入新的纪元——${ERAS[target].name}！`);
    emit("era-up");
  }
}
// 城内筑路：聚落辖区内的房/田沿直线铺路到粮仓（每格消耗 1 石材，石材不足则停工）
function buildTownRoads(s) {
  const R = SIM.SETTLEMENT_RADIUS;
  const buildings = [...world.houses, ...world.farms];
  let laid = 0;
  const stock = ensureStock(s);
  for (const b of buildings) {
    const d = Math.abs(b.x - s.x) + Math.abs(b.y - s.y);
    if (d <= 1 || d > R) continue;
    const n = Math.max(Math.abs(b.x - s.x), Math.abs(b.y - s.y));
    for (let i = 1; i < n; i++) {
      const x = Math.round(s.x + (b.x - s.x) * (i / n));
      const y = Math.round(s.y + (b.y - s.y) * (i / n));
      if (tileAt(x, y) === T.GRASS) {
        if (stock.stone < 1) continue;
        stock.stone -= 1;
        setTile(x, y, T.PATH);
        laid++;
      }
    }
  }
  if (laid > 0) logMsg(`「${s.name}」修筑道路 ${laid} 段，城内通衢成型。`);
}

// 出生点：任选一栋房屋找邻格空地；6 成概率偏向已成型的聚落（人往城里走）
function findBirthSpot() {
  const towns = world.settlements.filter(s => s.level >= 1);
  if (towns.length && rand() < 0.6) {
    const s = towns[randInt(0, towns.length - 1)];
    const p = freeNeighbor(s.x, s.y);
    if (p) return p;
  }
  for (let i = 0; i < 8; i++) {
    const h = world.houses[randInt(0, world.houses.length - 1)];
    const p = freeNeighbor(h.x, h.y);
    if (p) return p;
  }
  return null;
}

// ---- 农田生长（需水灌溉：5 格以内有水才能成熟，缺水停滞；结果缓存 2 秒节流） ----
function farmTick(dt) {
  for (const f of world.farms) {
    f.waterCd = (f.waterCd || 0) - dt;
    if (f.waterCd <= 0) {
      f.waterCd = 2;
      const was = f.irrigated;
      f.irrigated = nearAny(f.x, f.y, [T.WATER, T.DEEP], 5);
      if (was && !f.irrigated) logThrottled("一片农田失去了灌溉水源，收成停滞了。", 60);
    }
    if (!f.irrigated) continue;   // 缺水：停止生长（不倒退，等水来了继续）
    f.grow += dt;
    if (f.grow >= SIM.FARM_MATURITY) {
      f.grow = 0;
      const st = ownerSettle(f.x, f.y);
      if (st) ensureStock(st).food += SIM.FARM_YIELD;   // 粮食进所属城市库存
      f.flash = 0.6; // 成熟闪光（渲染用）
    }
    if (f.flash > 0) f.flash -= dt;
  }
}

// ---- 模拟主步进 ----
let _plannerCd = SIM.PLANNER_INTERVAL;
let _lastFeast = -999;
let _frontierCd = -999;

function simUpdate(dt) {
  world.time += dt;
  world.timeOfDay = (world.time % SIM.DAY_LEN) / SIM.DAY_LEN;

  for (const a of agents) a.update(dt);
  for (const c of creatures) c.update(dt);
  shipTick(dt);
  // 死者退场（名册/住房/任务引用同步释放）
  for (let i = agents.length - 1; i >= 0; i--) {
    if (agents[i].dead) agents.splice(i, 1);
  }
  farmTick(dt);
  berryTick();
  wildBreedTick();
  spawnWhaleOccasionally();
  quarryTick();

  _plannerCd -= dt;
  if (_plannerCd <= 0) { _plannerCd = SIM.PLANNER_INTERVAL; plannerTick(); }
}

// 劳动力市场：职业随需求平滑流转——零待办的职业逐渐转出，最缺工的职业逐渐补入
function jobMarketTick(pop) {
  // 探索者名额：按人口每 20 人 1 名（世界边界推进的主力），至少 1 人
  // 缺额时从人数最多的非探索者职业中挑 adventure 最高者转职（不抽独苗职业，避免抽走唯一的渔夫/猎人）
  const explorerN = agents.filter(a => !a.dead && a.job === "explorer").length;
  const explorerWant = Math.max(1, Math.floor(agents.length / 20));
  if (explorerN < explorerWant) {
    const byJob = {};
    for (const a of agents) if (!a.dead && a.job !== "explorer") (byJob[a.job] = byJob[a.job] || []).push(a);
    let pool = null;
    for (const j of Object.keys(byJob)) {
      if (byJob[j].length < 2) continue;
      if (!pool || byJob[j].length > pool.length) pool = byJob[j];
    }
    if (pool) {
      const best = pool.sort((a, b) => b.adventure - a.adventure)[0];
      best.job = "explorer";
      logMsg(`${best.name} 放下手中活计，专职成为探索者——去把世界的边界找出来。（${explorerN + 1}/${explorerWant}）`);
    }
  }
  const demand = {
    farmer:      tasksPending("FARM", true).length,
    lumberjack:  tasksPending("DIG", true).filter(t => t.res === "wood").length,
    miner:       tasksPending("DIG", true).filter(t => t.res === "stone").length,
    hunter:      tasksPending("HUNT", true).length + tasksPending("CAPTURE", true).length,
    fisher:      tasksPending("FISH", true).length,
    builder:     tasksPending("BUILD", true).length + tasksPending("PASTURE", true).length +
                 tasksPending("DOCK", true).length + tasksPending("QUARRY", true).length +
                 tasksPending("SANDPIT", true).length + tasksPending("PLANT", true).length +
                 tasksPending("PLANT_BERRY", true).length,
    explorer:    1,   // 探索自有行为，恒有需求
  };
  const workers = {};
  for (const a of agents) if (!a.dead) workers[a.job] = (workers[a.job] || 0) + 1;
  world.jobIdle = world.jobIdle || {};

  // 供过于求的职业：零待办持续 60 秒，或从业人数超过需求 4 倍
  const oversupply = [];
  for (const j of Object.keys(JOBS)) {
    if (j === "explorer") continue;
    const d = demand[j], w = workers[j] || 0;
    if (d === 0) {
      world.jobIdle[j] = (world.jobIdle[j] || 0) + SIM.PLANNER_INTERVAL;
      if (world.jobIdle[j] > 60) oversupply.push(j);
    } else {
      if (w > d * 4) oversupply.push(j);
      world.jobIdle[j] = 0;
    }
  }
  // 转入目标：人均需求最大且仍有待办的职业
  const target = Object.keys(JOBS).filter(j => demand[j] > 0)
    .sort((a, b) => demand[b] / Math.max(1, workers[b] || 0) - demand[a] / Math.max(1, workers[a] || 0))[0];
  if (!target || !oversupply.length || target === oversupply[0]) return;
  // 每周期最多转 2 人（平滑流动防振荡）
  let moved = 0;
  for (const j of oversupply) {
    const ws = agents.filter(a => a.job === j && !a.dead);
    if (!ws.length) continue;
    ws[0].job = target;
    moved++;
    if (moved >= 2) break;
  }
  if (moved) logThrottled(`${JOBS[oversupply[0]].name}转职为${JOBS[target].name}——劳动力随需求流动。`, 40);
}

// ---- 初始化模拟 ----
function simInit(seed) {
  genWorld(seed);
  // 初始 12 个小人：在任意房屋附近找落点（某些 seed 下粮仓邻格可能被堵死）
  let n = 0, guard = 0;
  while (n < 12 && guard++ < 400) {
    const p = findBirthSpot();
    if (p) { spawnAgent(p.x, p.y); n++; }
  }
  assignHomes();
  // 主岛：兽群、伙伴狗、河流刻蚀
  populateIslandCreatures(world.store.x, world.store.y, 14);
  carveRiver(world.islands[0]);
  for (let i = 0; i < 2; i++) {
    const p = freeNeighbor(world.store.x, world.store.y);
    if (p) spawnCreature(p.x, p.y, "dog");
  }
}

"use strict";
// ============ 音效：Web Audio 程序化合成（零资源文件，file:// 可用） ============
// AudioContext 必须在用户手势后初始化（浏览器自动播放策略）
// 订阅逻辑层事件播放；节流防止刷屏音（如连续竣工）

const sfx = (() => {
  let ctx = null, master = null;
  let muted = false;
  const _lastPlay = {};

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    } catch (e) { /* 无音频环境则静默 */ }
  }

  // 单音：振荡器 + 音量包络（可选滑音）
  function tone({ freq = 440, dur = 0.15, type = "sine", vol = 0.4, delay = 0, slide = 0 }) {
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  // 噪声：白噪声 + 带通 + 衰减包络（风声/水声/隆隆声）
  function noise({ dur = 0.4, vol = 0.25, freq = 700, q = 1, delay = 0 }) {
    const t0 = ctx.currentTime + delay;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }

  // 音色库
  const bank = {
    // UI
    click: () => tone({ freq: 880, dur: 0.05, type: "square", vol: 0.12 }),
    // 世界事件
    "build-done": () => {   // 竣工：大三和弦上行
      tone({ freq: 523, dur: 0.12, type: "triangle", vol: 0.35 });
      tone({ freq: 659, dur: 0.12, type: "triangle", vol: 0.35, delay: 0.09 });
      tone({ freq: 784, dur: 0.28, type: "triangle", vol: 0.4, delay: 0.18 });
    },
    "farm-done": () => {    // 开荒：轻快双音
      tone({ freq: 587, dur: 0.1, type: "triangle", vol: 0.3 });
      tone({ freq: 880, dur: 0.18, type: "triangle", vol: 0.3, delay: 0.08 });
    },
    birth: () => {          // 新生命：清脆上扬
      tone({ freq: 880, dur: 0.1, type: "sine", vol: 0.3 });
      tone({ freq: 1175, dur: 0.22, type: "sine", vol: 0.3, delay: 0.1 });
    },
    expand: () => {         // 开疆：低音号角
      tone({ freq: 196, dur: 0.4, type: "sawtooth", vol: 0.18 });
      tone({ freq: 262, dur: 0.5, type: "sawtooth", vol: 0.18, delay: 0.16 });
      tone({ freq: 392, dur: 0.6, type: "triangle", vol: 0.25, delay: 0.32 });
      noise({ dur: 0.8, vol: 0.08, freq: 400, q: 0.6, delay: 0.1 });
    },
    feast: () => {          // 宴席：琶音欢庆
      [523, 659, 784, 1047].forEach((f, i) =>
        tone({ freq: f, dur: 0.3, type: "triangle", vol: 0.3, delay: i * 0.09 }));
    },
    famine: () => {         // 饥荒：下沉警示
      tone({ freq: 220, dur: 0.55, type: "sawtooth", vol: 0.15, slide: -90 });
    },
    dusk: () => tone({ freq: 392, dur: 0.5, type: "sine", vol: 0.14, slide: -110 }),
    dawn: () => {
      tone({ freq: 523, dur: 0.3, type: "sine", vol: 0.12 });
      tone({ freq: 784, dur: 0.4, type: "sine", vol: 0.1, delay: 0.16 });
    },
    "settlement-up": () => {  // 聚落升级：庄严和弦
      [262, 330, 392, 523].forEach((f, i) =>
        tone({ freq: f, dur: 0.55, type: "triangle", vol: 0.28, delay: i * 0.12 }));
    },
    discovery: () => {        // 发现新大陆：神秘上扬琶音
      [392, 494, 587, 784].forEach((f, i) =>
        tone({ freq: f, dur: 0.35, type: "sine", vol: 0.22, delay: i * 0.1 }));
    },
    "era-up": () => {         // 时代演进：恢弘五音上行
      [262, 330, 392, 523, 659].forEach((f, i) =>
        tone({ freq: f, dur: 0.6, type: "triangle", vol: 0.26, delay: i * 0.13 }));
    },
  };

  // 同名音效最小间隔（秒）
  const THROTTLE = {
    click: 0.05, "build-done": 0.5, "farm-done": 0.5, birth: 1,
    expand: 2, feast: 2, famine: 30, dusk: 5, dawn: 5, "settlement-up": 1, discovery: 2, "era-up": 2,
  };

  function play(name) {
    if (!ctx || muted || !bank[name]) return;
    const now = ctx.currentTime;
    const gap = THROTTLE[name] || 0.5;
    if (_lastPlay[name] && now - _lastPlay[name] < gap) return;
    _lastPlay[name] = now;
    bank[name]();
  }

  return {
    init,
    resume() { if (ctx && ctx.state === "suspended") ctx.resume(); },
    play,
    toggle() { muted = !muted; return muted; },
    isMuted: () => muted,
  };
})();

// 订阅逻辑层世界事件
onEvent("build-done", () => sfx.play("build-done"));
onEvent("farm-done", () => sfx.play("farm-done"));
onEvent("birth", () => sfx.play("birth"));
onEvent("expand", () => sfx.play("expand"));
onEvent("feast", () => sfx.play("feast"));
onEvent("famine", () => sfx.play("famine"));
onEvent("settlement-up", () => sfx.play("settlement-up"));
onEvent("discovery", () => sfx.play("discovery"));
onEvent("era-up", () => sfx.play("era-up"));


"use strict";
// ============ 渲染：tile / 小人 / 昼夜 / 工程进度 ============

const TILE_PX = 14;
const camera = { x: 0, y: 0, zoom: 1.6 };

// 预计算每个 tile 的 4 个亮度变体（地面不死板，hash 取色不闪烁）
function shade(hex, f) {
  const r = Math.min(255, Math.round(parseInt(hex.slice(1, 3), 16) * f));
  const g = Math.min(255, Math.round(parseInt(hex.slice(3, 5), 16) * f));
  const b = Math.min(255, Math.round(parseInt(hex.slice(5, 7), 16) * f));
  return `rgb(${r},${g},${b})`;
}
const TILE_VARIANTS = {};
const TILE_ELEV_VARIANTS = {};  // 按海拔 5 档预调亮度：地势差用坐标海拔直接体现在底色明暗上
const TILE_GLEAM = {};          // 波光高亮色，预计算（无限深海下逐帧 parseInt 会卡）
const POND_VARIANTS = ["#2a6e5c", "#2e7562", "#317c68", "#35836e"].map(c => c);  // 人工池塘青绿色（区别海蓝）
const ELEV_TIERS = [0.76, 0.88, 1.0, 1.12, 1.24];  // 各海拔档的亮度系数
(function initVariants() {
  for (const k in TILE_META) {
    const base = TILE_META[k].color;
    TILE_VARIANTS[k] = [0.92, 0.97, 1.0, 1.05].map(f => shade(base, f));
    TILE_ELEV_VARIANTS[k] = ELEV_TIERS.map(f =>
      [0.92, 0.97, 1.0, 1.05].map(g => shade(base, f * g)));
    TILE_GLEAM[k] = shade(base, 1.08);
  }
})();
function elevTierOf(e) {
  if (!(e >= 0.28)) return 2;
  return Math.max(0, Math.min(4, Math.floor((e - 0.28) / (0.92 - 0.28) * 5)));
}

// 房屋信息缓存（granary/floors；houses 只增不减，用长度做缓存标记）
let _hCache = null, _hCacheLen = -1;
function houseInfo(x, y) {
  if (!_hCache || world.houses.length !== _hCacheLen) {
    _hCache = new Map(world.houses.map(h => [h.x + "," + h.y, h]));
    _hCacheLen = world.houses.length;
  }
  return _hCache.get(x + "," + y);
}
// 该格属于哪个聚落（粮仓即聚落中心）
function settlementAt(x, y) {
  for (const s of world.settlements) if (s.x === x && s.y === y) return s;
  return null;
}

// 功能分区底纹缓存（zones 变化不频繁，按 zonesVersion 重建）
let _zCache = null, _zCacheVer = -1;
const ZONE_COLOR = { farm: "rgba(222,200,80,0.20)", housing: "rgba(230,150,90,0.18)", market: "rgba(120,180,220,0.18)" };
function zoneAt(x, y) {
  if (!_zCache || world.zonesVersion !== _zCacheVer) {
    _zCache = new Map();
    for (const s of world.settlements) {
      if (!s.zones) continue;
      for (const z of s.zones) {
        for (let dy = -z.r; dy <= z.r; dy++) {
          for (let dx = -z.r; dx <= z.r; dx++) {
            if (dx * dx + dy * dy > z.r * z.r) continue;
            const k = (z.x + dx) + "," + (z.y + dy);
            if (!_zCache.has(k)) _zCache.set(k, z.type);
          }
        }
      }
    }
    _zCacheVer = world.zonesVersion;
  }
  return _zCache.get(x + "," + y);
}

// 远景 chunk 缩略图缓存：zoom<0.4 时整块 drawImage，避免逐格绘制百万 tile 卡死
// thumbDirty 失效机制：tile 被点亮/施工改写后 chunk 标脏，渲染帧内限流重建——缩略图与实际地图保持一致
const _chunkThumbs = new Map();
let _thumbBudget = 6;   // 每帧最多重建 6 块（防点亮风暴时的重建尖峰）
function chunkThumb(cx, cy, c) {
  const k = cx + "," + cy;
  let cv = _chunkThumbs.get(k);
  if (cv && !c.thumbDirty) return cv;
  if (_thumbBudget <= 0 && cv) return cv;   // 预算耗尽：先用旧图（下一帧补上）
  _thumbBudget--;
  cv = cv || document.createElement("canvas");
  cv.width = CHUNK; cv.height = CHUNK;
  const c2 = cv.getContext("2d");
  for (let y = 0; y < CHUNK; y++) {
    for (let x = 0; x < CHUNK; x++) {
      const t = c.tiles[y * CHUNK + x];
      const eT = c.elev ? elevTierOf(c.elev[y * CHUNK + x]) : 2;
      const isPond = t === T.WATER && world.ponds.has((cx * CHUNK + x) + "," + (cy * CHUNK + y));
      c2.fillStyle = t === T.VOID ? "#05070c"
        : isPond ? POND_VARIANTS[(hash2(cx * CHUNK + x, cy * CHUNK + y) * 4) | 0]
        : TILE_ELEV_VARIANTS[t][eT][(hash2(cx * CHUNK + x, cy * CHUNK + y) * 4) | 0];
      c2.fillRect(x, y, 1, 1);
    }
  }
  c.thumbDirty = false;
  _chunkThumbs.set(k, cv);
  return cv;
}

function drawScene(ctx, cw, ch, selected, selectedCreature, visualTod, waveT) {
  // 背景为虚空深渊色：未生成区域（VOID）露出此色，探索到后显现海与岛屿
  ctx.fillStyle = "#05070c";
  ctx.fillRect(0, 0, cw, ch);

  const s = TILE_PX * camera.zoom;
  const ox = cw / 2 - camera.x * s;
  const oy = ch / 2 - camera.y * s;
  const x0 = Math.floor(-ox / s);
  const y0 = Math.floor(-oy / s);
  const x1 = Math.ceil((cw - ox) / s);
  const y1 = Math.ceil((ch - oy) / s);
  const t = world.time;

  // 昼夜强度（窗光/遮罩都要用）
  // 昼夜强度（视觉时钟 visualTod：与模拟速度分离，封顶 10×）
  const tod = visualTod;
  let night = 0;
  if (tod < SIM.NIGHT_END) night = 1 - tod / SIM.NIGHT_END;
  else if (tod > SIM.NIGHT_START) night = (tod - SIM.NIGHT_START) / (1 - SIM.NIGHT_START);

  // ---- 远景路径（zoom<0.4）：chunk 缩略图，只生成相机中心附近，防内存/帧率爆炸 ----
  if (camera.zoom < 0.4) {
    _thumbBudget = 6;   // 每帧重建预算
    const R = 40;   // 中心 ±40 格范围内保证生成，更远保持虚空等待探索
    ensureChunksFor(Math.floor(camera.x - R), Math.floor(camera.y - R), Math.ceil(camera.x + R), Math.ceil(camera.y + R));
    const cs = CHUNK * s;
    const cx0 = Math.floor(-ox / cs), cy0 = Math.floor(-oy / cs);
    const cx1 = Math.ceil((cw - ox) / cs), cy1 = Math.ceil((ch - oy) / cs);
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const c = world.chunks.get(chunkKey(cx, cy));
        if (!c || !c.gen) continue;
        ctx.drawImage(chunkThumb(cx, cy, c), ox + cx * cs, oy + cy * cs, cs + 0.5, cs + 0.5);
      }
    }
    if (night > 0) {
      ctx.fillStyle = `rgba(12,18,48,${night * 0.45})`;
      ctx.fillRect(0, 0, cw, ch);
    }
    return;
  }

  // 视口内 chunk 懒生成（外扩 8 格，拖拽时边缘更稳），未生成 = 虚空
  ensureChunksFor(x0 - 8, y0 - 8, x1 + 8, y1 + 8);

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const tile = tileAt(x, y);
      if (tile === T.VOID) continue;   // 虚空：未被探索的深渊
      const h = hash2(x, y);
      // 海拔档位：地势差通过坐标海拔直接体现在底色明暗（高地亮、洼地暗）
      const cHere = world.chunks.get(chunkKey(x >> 5, y >> 5));
      let eTier = 2;
      if (cHere && cHere.elev) {
        eTier = elevTierOf(cHere.elev[cIdx(x, y)]);
      }
      let variant = TILE_ELEV_VARIANTS[tile][eTier][(h * 4) | 0];
      // 人工池塘：青绿色区分天然浅海（world.ponds 标记）
      if (tile === T.WATER && world.ponds.has(x + "," + y)) {
        variant = POND_VARIANTS[(h * 4) | 0];
      }
      // 水面波光：相位用波光时钟（暂停即静止，倍速不影响频率），高亮更柔和
      if ((tile === T.WATER || tile === T.DEEP) && ((h * 7 + waveT) % 1) < 0.08) {
        variant = TILE_GLEAM[tile];
      }
      const px = ox + x * s, py = oy + y * s;
      ctx.fillStyle = variant;
      ctx.fillRect(px, py, s + 0.5, s + 0.5);

      // 瀑布：水域紧邻悬崖时画流动水帘
      if ((tile === T.WATER || tile === T.DEEP) && s >= 8) {
        let nearCliff = false;
        for (const [ddx, ddy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          if (tileAt(x + ddx, y + ddy) === T.CLIFF) { nearCliff = true; break; }
        }
        if (nearCliff) {
          const ph2 = (t * 2.2 + h * 5) % 1;
          ctx.fillStyle = `rgba(240,248,255,${0.55 - ph2 * 0.3})`;
          for (let i = 0; i < 3; i++) {
            ctx.fillRect(px + s * (0.15 + i * 0.28), py + s * ((ph2 + i * 0.3) % 0.7), s * 0.14, s * 0.3);
          }
        }
      }

      // 功能分区底纹（城邦时代后划定）
      const zn = zoneAt(x, y);
      if (zn) {
        ctx.fillStyle = ZONE_COLOR[zn];
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
      }

      // 地表细节：投影 + 立体面 + 特征色，缩小时降级保特征
      if (tile === T.GRASS && s >= 10 && hash2(x + 8, y + 8) < 0.05) {
        // 草地点缀小花
        ctx.fillStyle = h < 0.5 ? "#e8d9a0" : "#d9909f";
        ctx.fillRect(px + s * (0.3 + h * 0.4), py + s * (0.4 + h * 0.2), s * 0.1, s * 0.1);
      }
      if (tile === T.TREE) {
        if (s >= 8) {
          ctx.fillStyle = "rgba(0,40,10,0.35)";
          ctx.beginPath(); ctx.ellipse(px + s * 0.62, py + s * 0.8, s * 0.3, s * 0.11, 0, 0, 7); ctx.fill();
          ctx.fillStyle = "#5a3a1e";
          ctx.fillRect(px + s * 0.44, py + s * 0.5, s * 0.12, s * 0.32);
          ctx.fillStyle = "#1d4a22";
          ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.4, s * 0.34, 0, 7); ctx.fill();
          ctx.fillStyle = shade("#2e6b35", 0.9 + h * 0.25);
          ctx.beginPath(); ctx.arc(px + s * 0.42, py + s * 0.32, s * 0.2, 0, 7); ctx.fill();
        } else {
          ctx.fillStyle = "#1d4a22";
          ctx.fillRect(px + s * 0.16, py + s * 0.1, s * 0.68, s * 0.7);
        }
      } else if (tile === T.MOUNTAIN) {
        if (s >= 8) {
          ctx.fillStyle = "rgba(0,0,25,0.3)";
          ctx.beginPath(); ctx.ellipse(px + s * 0.5, py + s * 0.84, s * 0.42, s * 0.09, 0, 0, 7); ctx.fill();
          const peakX = px + s * (0.32 + h * 0.36);
          ctx.fillStyle = "#8d9099";
          ctx.beginPath();
          ctx.moveTo(px + s * 0.06, py + s * 0.84);
          ctx.lineTo(peakX, py + s * 0.14);
          ctx.lineTo(px + s * 0.94, py + s * 0.84);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#5c606a"; // 右侧暗面 → 立体
          ctx.beginPath();
          ctx.moveTo(peakX, py + s * 0.14);
          ctx.lineTo(px + s * 0.94, py + s * 0.84);
          ctx.lineTo(peakX, py + s * 0.84);
          ctx.closePath(); ctx.fill();
          if (h > 0.55) { // 雪顶
            ctx.fillStyle = "#eceff4";
            ctx.beginPath();
            ctx.moveTo(peakX, py + s * 0.14);
            ctx.lineTo(peakX - s * 0.13, py + s * 0.34);
            ctx.lineTo(peakX + s * 0.13, py + s * 0.34);
            ctx.closePath(); ctx.fill();
          }
        } else {
          ctx.fillStyle = "#767a84";
          ctx.beginPath();
          ctx.moveTo(px + s * 0.1, py + s * 0.85);
          ctx.lineTo(px + s * 0.5, py + s * 0.18);
          ctx.lineTo(px + s * 0.9, py + s * 0.85);
          ctx.closePath(); ctx.fill();
        }
      } else if (tile === T.HOUSE) {
        const hInfo = houseInfo(x, y);
        const granary = !!(hInfo && hInfo.granary);
        const floors = hInfo ? (hInfo.floors || 1) : 1;
        const sett = granary ? settlementAt(x, y) : null;
        // 城镇(2级)以上：民房变石砌，粮仓变市政厅
        let stone = false;
        if (!granary) {
          for (const st of world.settlements) {
            if (st.level >= 2 && Math.abs(st.x - x) + Math.abs(st.y - y) <= SIM.SETTLEMENT_RADIUS) { stone = true; break; }
          }
        }
        if (s >= 8) {
          const wallH = floors >= 3 ? 0.62 : floors >= 2 ? 0.54 : 0.46;   // 高楼更高
          ctx.fillStyle = stone ? "#c8cdd4" : "#e8dcc0";
          ctx.fillRect(px + s * 0.14, py + s * (1.0 - wallH), s * 0.72, s * wallH - s * 0.02);
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.fillRect(px + s * 0.14, py + s * 0.82, s * 0.72, s * 0.05);
          ctx.fillStyle = granary ? "#d9a441" : (stone ? "#5d6b7a" : "#b0502e");
          ctx.beginPath();
          ctx.moveTo(px + s * 0.06, py + s * (1.04 - wallH));
          ctx.lineTo(px + s * 0.5, py + s * (1.0 - wallH) - s * 0.38);
          ctx.lineTo(px + s * 0.94, py + s * (1.04 - wallH));
          ctx.closePath(); ctx.fill();
          // 高楼窗户（随层数多排，夜间亮窗）
          if (floors >= 2) {
            const lit = night > 0.3;
            ctx.fillStyle = lit ? "rgba(255,220,130,0.95)" : "rgba(70,90,120,0.9)";
            for (let fl = 0; fl < floors - 1; fl++) {
              ctx.fillRect(px + s * 0.24, py + s * (0.34 - fl * 0.22), s * 0.16, s * 0.12);
              ctx.fillRect(px + s * 0.6, py + s * (0.34 - fl * 0.22), s * 0.16, s * 0.12);
            }
          }
          ctx.fillStyle = "#4a2e18";
          ctx.fillRect(px + s * (granary ? 0.36 : 0.42), py + s * 0.6, s * (granary ? 0.28 : 0.16), s * 0.26);
          if (sett && sett.level >= 2) { // 市政厅旗杆 + 三角旗
            ctx.fillStyle = "#3a2a18";
            ctx.fillRect(px + s * 0.5 - s * 0.03, py - s * 0.55, s * 0.06, s * 0.62);
            ctx.fillStyle = sett.level >= 3 ? "#c23b3b" : "#3b6ac2";
            ctx.beginPath();
            ctx.moveTo(px + s * 0.53, py - s * 0.55);
            ctx.lineTo(px + s * 0.95, py - s * 0.42);
            ctx.lineTo(px + s * 0.53, py - s * 0.28);
            ctx.closePath(); ctx.fill();
          }
        } else {
          ctx.fillStyle = granary ? "#d9a441" : (stone ? "#5d6b7a" : "#b0502e");
          ctx.fillRect(px + s * 0.12, py + s * 0.12, s * 0.76, s * 0.76);
        }
      } else if (tile === T.FENCE) {
        ctx.fillStyle = "#7a5a2e";
        ctx.fillRect(px, py + s * 0.3, s + 0.5, s * 0.12);
        ctx.fillRect(px, py + s * 0.62, s + 0.5, s * 0.12);
        ctx.fillStyle = "#5c3d1e";
        ctx.fillRect(px + s * 0.15, py + s * 0.2, s * 0.12, s * 0.62);
        ctx.fillRect(px + s * 0.73, py + s * 0.2, s * 0.12, s * 0.62);
      } else if (tile === T.CAVE) {
        ctx.fillStyle = "#3a3a42";   // 岩体
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.fillStyle = "#0a0a10";   // 洞口
        ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.62, s * 0.26, Math.PI, 0); ctx.fill();
        ctx.fillRect(px + s * 0.24, py + s * 0.62, s * 0.52, s * 0.26);
        ctx.fillStyle = "#1a1a22";
        ctx.fillRect(px + s * 0.1, py + s * 0.1, s * 0.2, s * 0.12);
      } else if (tile === T.CLIFF) {
        ctx.fillStyle = "#53565e";
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.fillStyle = "#787c85";   // 顶部亮缘
        ctx.fillRect(px, py, s + 0.5, s * 0.22);
        ctx.fillStyle = "#3a3d45";   // 底部深裂
        ctx.fillRect(px + s * 0.1, py + s * 0.55, s * 0.25, s * 0.35);
        ctx.fillRect(px + s * 0.6, py + s * 0.45, s * 0.28, s * 0.45);
      } else if (tile === T.QUARRY) {
        ctx.fillStyle = "#9a9284";
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.fillStyle = "#6e675c";
        ctx.fillRect(px + s * 0.15, py + s * 0.3, s * 0.3, s * 0.25);
        ctx.fillRect(px + s * 0.55, py + s * 0.5, s * 0.28, s * 0.3);
        ctx.fillStyle = "#c9c2b4";
        ctx.fillRect(px + s * 0.3, py + s * 0.15, s * 0.25, s * 0.18);
      } else if (tile === T.SANDPIT) {
        ctx.fillStyle = "#d8c890";
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.fillStyle = "#b8a266";
        ctx.beginPath(); ctx.arc(px + s * 0.4, py + s * 0.55, s * 0.3, 0, 7); ctx.fill();
        ctx.fillStyle = "#efe2b0";
        ctx.beginPath(); ctx.arc(px + s * 0.55, py + s * 0.4, s * 0.18, 0, 7); ctx.fill();
      } else if (tile === T.DOCK) {
        ctx.fillStyle = "#8a6a42";
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.fillStyle = "#6e5232";   // 木板
        ctx.fillRect(px, py + s * 0.1, s + 0.5, s * 0.16);
        ctx.fillRect(px, py + s * 0.42, s + 0.5, s * 0.16);
        ctx.fillRect(px, py + s * 0.74, s + 0.5, s * 0.16);
        ctx.fillStyle = "#4a3520";   // 系船桩
        ctx.fillRect(px + s * 0.42, py + s * 0.38, s * 0.16, s * 0.24);
      } else if (tile === T.BERRY) {
        if (s >= 8) {
          ctx.fillStyle = "#2e5a28";
          ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.55, s * 0.32, 0, 7); ctx.fill();
          ctx.fillStyle = "#c23b3b";
          const stock = world.berryStock.get(x + "," + y) || 0;
          for (let i = 0; i < stock; i++) {
            ctx.beginPath();
            ctx.arc(px + s * (0.3 + (i % 2) * 0.3), py + s * (0.4 + Math.floor(i / 2) * 0.25), s * 0.09, 0, 7);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = "#3e6b35"; ctx.fillRect(px + s * 0.2, py + s * 0.2, s * 0.6, s * 0.6);
        }
      } else if (tile === T.FRUIT) {
        if (s >= 8) {
          ctx.fillStyle = "#5a3a1e"; ctx.fillRect(px + s * 0.45, py + s * 0.5, s * 0.1, s * 0.3);
          ctx.fillStyle = "#3a7038";
          ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.38, s * 0.36, 0, 7); ctx.fill();
          ctx.fillStyle = "#e8a13b";
          const stock = world.berryStock.get(x + "," + y) || 0;
          for (let i = 0; i < stock; i++) {
            ctx.beginPath();
            ctx.arc(px + s * (0.3 + (i % 3) * 0.2), py + s * (0.3 + Math.floor(i / 3) * 0.18), s * 0.07, 0, 7);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = "#4a7a3a"; ctx.fillRect(px + s * 0.2, py + s * 0.2, s * 0.6, s * 0.6);
        }
      } else if (tile === T.PASTURE) {
        ctx.fillStyle = "#a89a62";
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.strokeStyle = "#7a6a3a"; ctx.lineWidth = 1;
        ctx.strokeRect(px + s * 0.15, py + s * 0.15, s * 0.7, s * 0.7);
        ctx.beginPath();
        ctx.moveTo(px + s * 0.15, py + s * 0.5); ctx.lineTo(px + s * 0.85, py + s * 0.5);
        ctx.moveTo(px + s * 0.5, py + s * 0.15); ctx.lineTo(px + s * 0.5, py + s * 0.85);
        ctx.stroke();
      } else if (tile === T.BRIDGE) {
        ctx.fillStyle = "#235d96"; // 桥下水面（透出蓝色，一眼可见桥在水上）
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
        ctx.fillStyle = "rgba(255,255,255,0.18)"; // 水面波纹
        for (let i = 0; i < 2; i++) ctx.fillRect(px + s * 0.15, py + s * (0.22 + i * 0.45), s * 0.7, s * 0.05);
        ctx.fillStyle = "#a97b48"; // 木板（留缝露水）
        for (let i = 0; i < 3; i++) ctx.fillRect(px + s * 0.06, py + s * (0.12 + i * 0.3), s * 0.88, s * 0.16);
        ctx.fillStyle = "#5c3d1e"; // 两侧栏杆
        ctx.fillRect(px, py, s + 0.5, s * 0.07);
        ctx.fillRect(px, py + s * 0.93, s + 0.5, s * 0.07);
      } else if (tile === T.FARM) {
        if (s >= 8) {
          ctx.fillStyle = "#9c7a46"; // 翻耕的土
          ctx.fillRect(px, py, s + 0.5, s + 0.5);
          ctx.fillStyle = "#6fae4e"; // 苗行
          for (let i = 0; i < 3; i++) ctx.fillRect(px + s * 0.12, py + s * (0.2 + i * 0.26), s * 0.76, s * 0.1);
        } else {
          ctx.fillStyle = "#9c7a46";
          ctx.fillRect(px, py, s + 0.5, s + 0.5);
          ctx.fillStyle = "#6fae4e";
          ctx.fillRect(px + s * 0.15, py + s * 0.35, s * 0.7, s * 0.3);
        }
      } else if (tile === T.SAND) {
        if (s >= 8) {
          ctx.fillStyle = "rgba(140,120,70,0.45)";
          ctx.fillRect(px + s * (0.2 + h * 0.3), py + s * 0.3, s * 0.08, s * 0.08);
          ctx.fillRect(px + s * (0.55 - h * 0.25), py + s * 0.66, s * 0.08, s * 0.08);
        }
      } else if (tile === T.PATH) {
        ctx.fillStyle = shade("#b09a72", 0.9 + h * 0.15);
        ctx.fillRect(px + s * 0.08, py + s * 0.08, s * 0.84, s * 0.84);
      }
    }
  }

  // 工程任务进度
  for (const task of tasks.list) {
    const px = ox + task.x * s, py = oy + task.y * s;
    if (task.type === "BUILD" || task.type === "FARM") {
      const p = Math.min(1, task.progress / task.need);
      ctx.fillStyle = "rgba(90,60,30,0.85)";
      ctx.fillRect(px + s * 0.1, py + s * 0.1, s * 0.8, s * 0.8);
      ctx.strokeStyle = "#e8d9a0"; ctx.lineWidth = 1;
      ctx.strokeRect(px + s * 0.1, py + s * 0.1, s * 0.8, s * 0.8);
      ctx.fillStyle = "#e8d9a0";
      ctx.fillRect(px + s * 0.15, py + s * 0.85, s * 0.7 * p, s * 0.1); // 进度条
    } else {
      // 挖山/填海/架桥：按 tile hp 画施工进度
      const meta = TILE_META[tileAt(task.x, task.y)];
      const hpMax = task.type === "BRIDGE" ? SIM.BRIDGE_HP : (meta.hp || 1);
      const ch2 = world.chunks.get(chunkKey(task.x >> 5, task.y >> 5));
      const hp = ch2 && ch2.gen ? ch2.hp[cIdx(task.x, task.y)] : 0;
      if (hp > 0 && hp < hpMax) {
        ctx.fillStyle = `rgba(255,255,240,${0.12 + 0.2 * (1 - hp / hpMax)})`;
        ctx.fillRect(px, py, s + 0.5, s + 0.5);
      }
    }
  }

  // 动物（远景 zoom<0.4 时跳过，走 chunk 缩略图）
  if (s >= 5.6) {
    for (const c of creatures) {
      if (c.dead) continue;
      const px = ox + c.x * s, py = oy + c.y * s;
      const meta = CREATURE_META[c.type];
      const r = Math.max(1.5, s * 0.16 * meta.size);
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath(); ctx.ellipse(px, py + r * 0.8, r, r * 0.4, 0, 0, 7); ctx.fill();
      if ((c.strandT || 0) > 3) {   // 搁浅求救标记（被困动物头顶红色感叹号）
        ctx.fillStyle = "#e74c3c";
        ctx.font = `bold ${Math.max(8, s * 0.5)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("!", px, py - r * 2.2);
      }
      if (c.type === "cow") {
        ctx.fillStyle = "#8a5a3a";
        ctx.beginPath(); ctx.ellipse(px, py, r * 1.15, r * 0.8, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#e8e0d0";
        ctx.fillRect(px - r * 0.9, py - r * 1.1, r * 0.3, r * 0.35);
        ctx.fillRect(px + r * 0.6, py - r * 1.1, r * 0.3, r * 0.35);
      } else if (c.type === "goat") {
        ctx.fillStyle = "#e8e4da";
        ctx.beginPath(); ctx.ellipse(px, py, r * 1.05, r * 0.75, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#6b6b6b";
        ctx.beginPath(); ctx.arc(px + r * 0.9, py - r * 0.3, r * 0.4, 0, 7); ctx.fill();
      } else if (c.type === "deer") {
        ctx.fillStyle = "#a5713d";
        ctx.beginPath(); ctx.ellipse(px, py, r * 0.95, r * 0.65, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#7a4f28";
        ctx.beginPath(); ctx.arc(px + r * 0.85, py - r * 0.45, r * 0.32, 0, 7); ctx.fill();
        ctx.strokeStyle = "#5c3a1a"; ctx.lineWidth = 0.8;   // 鹿角
        ctx.beginPath();
        ctx.moveTo(px + r * 0.9, py - r * 0.75); ctx.lineTo(px + r * 1.2, py - r * 1.25);
        ctx.moveTo(px + r * 1.0, py - r * 0.85); ctx.lineTo(px + r * 1.35, py - r * 1.0);
        ctx.stroke();
      } else if (c.type === "boar") {
        ctx.fillStyle = "#5c4632";
        ctx.beginPath(); ctx.ellipse(px, py, r * 1.1, r * 0.85, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#3d2e1e";
        ctx.beginPath(); ctx.arc(px + r * 0.95, py - r * 0.15, r * 0.45, 0, 7); ctx.fill();
      } else if (c.type === "wolf") {
        ctx.fillStyle = "#787882";
        ctx.beginPath(); ctx.ellipse(px, py, r * 1.2, r * 0.6, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#5a5a64";
        ctx.beginPath(); ctx.arc(px + r * 1.1, py - r * 0.35, r * 0.4, 0, 7); ctx.fill();
      } else if (c.type === "fish") {
        ctx.fillStyle = "rgba(120,180,220,0.85)";
        for (let i = 0; i < 3; i++) {
          const fx = px + Math.cos(s * 0.8 + i * 2.1) * r * 1.2, fy = py + Math.sin(s * 0.8 + i * 2.1) * r * 0.7;
          ctx.beginPath(); ctx.ellipse(fx, fy, r * 0.4, r * 0.18, s * 0.8 + i, 0, 7); ctx.fill();
        }
      } else if (c.type === "turtle") {
        ctx.fillStyle = "#4a7a55";
        ctx.beginPath(); ctx.ellipse(px, py, r * 0.95, r * 0.7, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#33604a";
        ctx.beginPath(); ctx.ellipse(px, py, r * 0.6, r * 0.45, 0, 0, 7); ctx.fill();
      } else if (c.type === "whale") {
        ctx.fillStyle = "#2c4a66";
        ctx.beginPath(); ctx.ellipse(px, py, r * 1.6, r * 0.75, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#3d6284";
        ctx.beginPath(); ctx.ellipse(px - r * 0.3, py - r * 0.2, r * 0.9, r * 0.4, 0, 0, 7); ctx.fill();
        const sp2 = (s * 0.5) % 2;   // 喷水柱
        if (sp2 < 1) { ctx.fillStyle = `rgba(240,248,255,${0.6 - sp2 * 0.6})`; ctx.fillRect(px, py - r * 1.5 - sp2 * r, r * 0.15, r * 0.8); }
      } else if (c.type === "dog") {
        ctx.fillStyle = "#8a8a92";
        ctx.beginPath(); ctx.ellipse(px, py, r * 1.1, r * 0.7, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#5a5a62";
        ctx.beginPath(); ctx.arc(px - r * 0.9, py - r * 0.2, r * 0.42, 0, 7); ctx.fill();
      }
      if (c.type === "bird") {   // 鸟：空中飞行的小 V 形
        const fw = Math.sin(s * 6 + c.phase) * r * 0.5;
        ctx.strokeStyle = "#3a3a44"; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(px - r * 1.2, py - fw * 0.5);
        ctx.lineTo(px, py - r * 0.4);
        ctx.lineTo(px + r * 1.2, py - fw * 0.5);
        ctx.stroke();
        continue;
      }
      if (c.pasture) { // 圈养标记
        ctx.strokeStyle = "rgba(200,170,80,0.8)"; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(px, py, r * 1.5, 0, 7); ctx.stroke();
      }
      if (c === selectedCreature) { // 选中光环
        ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(px, py + r * 0.6, r * 2, r * 1.2, 0, 0, 7); ctx.stroke();
      }
    }
  }

  // 远景：显示各地区名字（缩小到看不清小人时，地图上标注地区名）
  if (camera.zoom < 0.8) {
    ctx.textAlign = "center";
    ctx.font = "bold 13px 'PingFang SC', sans-serif";
    const SETTLE_L = ["定居点", "村庄", "城镇", "城市"];
    const label = (x, y, text) => {
      const px = ox + x * s, py = oy + y * s - s * 0.6;
      const w = ctx.measureText(text).width + 10;
      ctx.fillStyle = "rgba(8,10,16,0.72)";
      ctx.fillRect(px - w / 2, py - 14, w, 18);
      ctx.fillStyle = "#e8d9a0";
      ctx.fillText(text, px, py);
    };
    for (const o of world.islands) {
      if (!o.name) continue;
      if (world.settlements.some(st => Math.hypot(st.x - o.x, st.y - o.y) < o.r + 5)) continue;   // 有聚落的岛显示聚落名
      label(o.x, o.y, o.name);
    }
    for (const st of world.settlements) {
      label(st.x, st.y, `${st.name} · ${SETTLE_L[st.level]}`);
    }
    ctx.textAlign = "left";
  }

  // 远航船（航海家在船上时不单独绘制小人）
  for (const s of world.ships) {
    const px = ox + s.x * s, py = oy + s.y * s;
    const boatScale = s.boat ? 0.75 : 1;   // 渔船比远航船小一号
    const r = Math.max(3, s * 0.55) * boatScale;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(s.ang);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0, r * 0.4, r * 1.1, r * 0.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = s.boat ? "#5c6470" : "#7a5a30";   // 船身（渔船灰）
    ctx.beginPath();
    ctx.moveTo(r * 1.3, 0);
    ctx.quadraticCurveTo(0, r * 0.85, -r * 1.1, r * 0.45);
    ctx.lineTo(-r * 1.1, -r * 0.45);
    ctx.quadraticCurveTo(0, -r * 0.85, r * 1.3, 0);
    ctx.closePath(); ctx.fill();
    if (s.state === "sailing" || s.state === "rescue") {   // 帆（救援船挂红旗）
      ctx.fillStyle = s.state === "rescue" ? "#d9483b" : "#f0ead8";
      ctx.beginPath();
      ctx.moveTo(r * 0.1, -r * 0.15);
      ctx.lineTo(r * 0.1, -r * 1.1);
      ctx.lineTo(r * 0.75, -r * 0.2);
      ctx.closePath(); ctx.fill();
    }
    if (s.boat) {   // 渔船小旗
      ctx.fillStyle = "#8fa3b8";
      ctx.fillRect(-r * 0.15, -r * 1.2, r * 0.12, r * 0.6);
    }
    if (s.state === "stranded") {   // 被困求救标记（抵消船体旋转保持竖直）
      ctx.rotate(-s.ang);
      ctx.fillStyle = "#e74c3c";
      ctx.font = `bold ${Math.max(9, s * 1.4)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("!", 0, -r * 1.9);
    }
    ctx.restore();
    if (s.state === "fishing") {   // 捕捞涟漪（不随船旋转）
      ctx.strokeStyle = "rgba(240,240,220,0.6)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(px, py, r * (1.6 + Math.sin(s.x * 7 + s.y * 3) * 0.4), 0, 7);
      ctx.stroke();
    }
  }

  // 小人：头 + 身两段式 + 深色描边，任何底色上一眼可辨
  for (const a of agents) {
    if (a.state === "voyage") continue;   // 航海中的人在船上
    const px = ox + a.x * s, py = oy + a.y * s;
    let c = "#f2ede0";
    if (a.state === "work") c = "#ff9f43";
    else if (a.state === "eat") c = "#ffd166";
    else if (a.state === "sleep") c = "#8fa3e8";   // 睡觉提亮，夜里也可见
    const r = Math.max(1.8, s * 0.15);             // 头半径
    const bw = r * 1.4, bh = r * 2.1;              // 身体

    // 影子
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(px, py + bh * 0.7, r * 1.05, r * 0.42, 0, 0, 7); ctx.fill();

    // 选中光环
    if (a === selected && s >= 6) {
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(px, py + bh * 0.5, r * 2.2, r * 1.5, 0, 0, 7); ctx.stroke();
    }

    if (s < 6) { // 极小缩放：单点降级
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(px, py, Math.max(1.5, r), 0, 7); ctx.fill();
      continue;
    }

    const bob = a.state === "walk" ? Math.abs(Math.sin(a.phase * 9)) * r * 0.3 : 0;
    ctx.save();
    ctx.translate(px, py - bob);
    let tilt = 0;
    if (a.state === "sleep") tilt = Math.PI / 2;               // 躺平
    else if (a.state === "work") tilt = Math.sin(a.phase * 13) * 0.16; // 干活前倾摆动
    ctx.rotate(tilt);

    ctx.fillStyle = c;
    ctx.strokeStyle = "rgba(15,15,25,0.85)";
    ctx.lineWidth = Math.max(0.6, s * 0.02);
    // 身体（椭圆）
    ctx.beginPath(); ctx.ellipse(0, bh * 0.18, bw * 0.5, bh * 0.5, 0, 0, 7);
    ctx.fill(); ctx.stroke();
    // 头
    ctx.beginPath(); ctx.arc(0, -bh * 0.5, r, 0, 7);
    ctx.fill(); ctx.stroke();
    // 原住民部族标记（头顶白色羽饰）
    if (a.native) {
      ctx.fillStyle = "#f5f0e0";
      ctx.fillRect(-r * 0.12, -bh * 0.5 - r * 1.7, r * 0.24, r * 1.1);
    }
    ctx.restore();

    // 状态标记
    if (a.state === "work") {          // 敲击火花
      const k = (a.phase * 2.2) % 1;
      ctx.fillStyle = `rgba(255,255,255,${(0.9 - k * 0.9).toFixed(2)})`;
      ctx.fillRect(px - r * 0.4, py - bh * 1.6 - k * r * 1.2, r * 0.8, r * 0.5);
    } else if (a.state === "eat") {    // 吃饭的小食物点
      ctx.fillStyle = "#fff3b0";
      ctx.beginPath(); ctx.arc(px + r * 1.5, py - bh * 0.8, r * 0.42, 0, 7); ctx.fill();
    } else if (a.state === "sleep" && s >= 10) { // 睡觉冒 z
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = `${Math.max(7, s * 0.45)}px sans-serif`;
      ctx.fillText("z", px + r * 0.8, py - bh * 0.8);
    }
  }

  // 昼夜遮罩（night 已在函数开头计算）
  if (night > 0) {
    ctx.fillStyle = `rgba(12,18,48,${night * 0.45})`;
    ctx.fillRect(0, 0, cw, ch);
  }
}

"use strict";
// ============ 主入口：主循环 / 相机输入 / UI ============

(function main() {
  const el = id => document.getElementById(id);   // DOM 快捷查找，全文件唯一定义（必须先于所有使用）
  const canvas = el("cv");
  const ctx = canvas.getContext("2d");
  let CW = 0, CH = 0;

  function resize() {
    CW = canvas.width = window.innerWidth;
    CH = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- 相机输入（Pointer Events：统一鼠标与触摸；单指拖拽/点按拾取，双指捏合缩放） ----
  let dragging = false, lastMX = 0, lastMY = 0;
  let downX = 0, downY = 0, downT = 0;   // 用于区分拖拽与点按
  let camTween = null;        // 回原点的平滑飞行
  const pointers = new Map(); // 活动指针表（多指捏合）
  let pinchDist = 0;

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    camTween = null;
    followMode = false; syncFollowBtn();   // 用户拖动视角即退出跟随
    if (pointers.size === 1) {
      dragging = true; lastMX = e.clientX; lastMY = e.clientY;
      downX = e.clientX; downY = e.clientY; downT = performance.now();
    } else if (pointers.size === 2) {
      dragging = false;
      const pts = [...pointers.values()];
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  });
  canvas.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      // 双指捏合缩放：以两指中点为锚
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0) applyZoom(camera.zoom * (d / pinchDist), (pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
      pinchDist = d;
      return;
    }
    if (dragging) {
      const s = TILE_PX * camera.zoom;
      camera.x -= (e.clientX - lastMX) / s;
      camera.y -= (e.clientY - lastMY) / s;
      lastMX = e.clientX; lastMY = e.clientY;
      clampCam();
    }
  });
  window.addEventListener("pointerup", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0 && dragging) {
      dragging = false;
      // 点按拾取：位移小 + 时间短（防长按拖拽误触）
      if (Math.hypot(e.clientX - downX, e.clientY - downY) < 8 && performance.now() - downT < 600) handlePick(e);
    }
    if (pointers.size === 1) {   // 双指抬起一指 → 回到单指拖拽
      const p = [...pointers.values()][0];
      dragging = true; lastMX = p.x; lastMY = p.y;
    }
  });
  canvas.addEventListener("pointercancel", e => {
    pointers.delete(e.pointerId);
    dragging = false;
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    camTween = null;
    const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;   // 缓速缩放
    applyZoom(camera.zoom * factor, e.clientX, e.clientY);
  }, { passive: false });

  // 统一缩放入口：nz 新倍率，(ax,ay) 屏幕锚点
  function applyZoom(nz, ax, ay) {
    nz = Math.min(6, Math.max(0.1, nz));
    const s0 = TILE_PX * camera.zoom, s1 = TILE_PX * nz;
    camera.x += (ax - CW / 2) * (1 / s0 - 1 / s1);
    camera.y += (ay - CH / 2) * (1 / s0 - 1 / s1);
    camera.zoom = nz;
    clampCam();
    syncZoomUI();
  }

  // 滑动轴与滚轮双向同步
  function syncZoomUI() {
    const sl = document.getElementById("zoom-slider");
    if (sl && +sl.value !== camera.zoom) sl.value = camera.zoom.toFixed(2);
    const zl = document.getElementById("zoom-label");
    if (zl) zl.textContent = camera.zoom.toFixed(1) + "×";
  }
  const zoomSlider = document.getElementById("zoom-slider");
  if (zoomSlider) {
    zoomSlider.addEventListener("input", () => applyZoom(+zoomSlider.value, CW / 2, CH / 2));
  }

  // 无限地图：相机不做边界限制（迷路可用「回原点」）
  function clampCam() {}

  // ---- 速度控制 ----
  let speed = 1;
  const speedBtns = {};
  function setSpeed(v) {
    speed = v;
    for (const k in speedBtns) speedBtns[k].classList.toggle("active", +k === v);
  }
  ["pause", "s1", "s2", "s10", "s100", "s1000"].forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    speedBtns[b.dataset.v] = b;
    b.addEventListener("click", () => { sfx.play("click"); setSpeed(+b.dataset.v); });
  });
  window.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); setSpeed(speed === 0 ? 1 : 0); }
    if (e.key === "1") setSpeed(1);
    if (e.key === "2") setSpeed(2);
    if (e.key === "3") setSpeed(10);
    if (e.key === "4") setSpeed(100);
    if (e.key === "5") setSpeed(1000);
  });

  // ---- 音效：首次手势解锁 AudioContext（浏览器自动播放策略） ----
  function ensureAudio() { sfx.init(); sfx.resume(); }
  window.addEventListener("pointerdown", ensureAudio);
  window.addEventListener("keydown", ensureAudio);

  // ---- 回原点：平滑飞行（easeInOutCubic，zoom 同步缓动） ----
  const goHomeBtn = el("go-home");
  if (goHomeBtn) {
    goHomeBtn.addEventListener("click", () => {
      const dist = Math.hypot(camera.x, camera.y);
      camTween = {
        x0: camera.x, y0: camera.y, x1: 0, y1: 0,
        z0: camera.zoom, z1: Math.max(camera.zoom, 1.2), t: 0,
        dur: Math.min(2.6, 0.5 + dist / 300),
      };
      sfx.play("click");
    });
  }

  const sfxBtn = document.getElementById("sfx-toggle");
  if (sfxBtn) {
    sfxBtn.addEventListener("click", () => {
      const m = sfx.toggle();
      sfxBtn.textContent = m ? "音效:关" : "音效:开";
      if (!m) sfx.play("click");
    });
  }

  // ---- 启动模拟（每次开局随机生成一张新地图；测试用固定种子）----
  simInit(Math.floor(Math.random() * 1e9));
  camera.x = world.store.x; camera.y = world.store.y;
  syncZoomUI();

  // ---- 主循环：固定步长模拟 ----
  // 步进上限按速度分档：1000× 允许每帧千步（帧率下降换取模拟吞吐），同时截断积压防螺旋
  const STEP = 1 / 30;
  let acc = 0, lastT = performance.now();
  let simStepsAcc = 0, rateCd = 0, rateVal = 0;   // 实际速率统计（sim 秒/真实秒，0.5s 刷新）
  let renderFlip = false;                         // 高倍速隔帧渲染标记
  let lastPhase = "day";
