<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小世界 · __BUILD_ID__</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07090e; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #cv { display: block; cursor: grab; touch-action: none; image-rendering: pixelated; }
  #cv:active { cursor: grabbing; }

  #ui-top {
    position: fixed; top: 0; left: 0; right: 0; height: 42px;
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    background: rgba(10, 13, 20, 0.82); border-bottom: 1px solid #1c2333;
    color: #cfd6e4; font-size: 13px; z-index: 10; user-select: none;
  }
  #ui-top .title { font-weight: 600; color: #e8d9a0; letter-spacing: 1px; }
  .stat { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .stat b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .lab { color: #6b7688; }
  #stat-clock { min-width: 58px; }
  #right-ctl { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  #speed-ctl { display: flex; gap: 6px; }
  #zoom-ctl { display: flex; align-items: center; gap: 8px; color: #6b7688; font-size: 12px; }
  #zoom-ctl b { color: #fff; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  #zoom-slider { width: 120px; accent-color: #4a5f8a; cursor: pointer; }
  #speed-ctl button {
    background: #161c2a; color: #8f9ab0; border: 1px solid #2a3448;
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  #speed-ctl button:hover { color: #dfe5f0; }
  #speed-ctl button.active { background: #2c3a58; color: #fff; border-color: #4a5f8a; }

  #log-panel {
    position: fixed; left: 12px; bottom: 12px; width: 340px; max-height: 200px;
    background: rgba(10, 13, 20, 0.82); border: 1px solid #1c2333; border-radius: 6px;
    padding: 8px 12px; z-index: 10; overflow: hidden;
  }
  #log-panel .log-title { color: #e8d9a0; font-size: 12px; margin-bottom: 6px; letter-spacing: 1px; }
  #logs { max-height: 160px; overflow-y: auto; font-size: 12px; line-height: 1.7; color: #aeb7c9; }
  #logs::-webkit-scrollbar { width: 4px; }
  #logs::-webkit-scrollbar-thumb { background: #2a3448; border-radius: 2px; }
  .log-line .log-t { color: #56617a; margin-right: 6px; }

  #hint {
    position: fixed; right: 12px; bottom: 12px; color: #56617a; font-size: 11px;
    background: rgba(10, 13, 20, 0.6); padding: 4px 10px; border-radius: 4px; z-index: 10;
  }
  #build-id { color: #56617a; font-size: 11px; }

  /* 手机端适配：窄屏两行顶栏、面板收窄、隐藏提示 */
  @media (max-width: 700px) {
    #ui-top { flex-wrap: wrap; height: auto; padding: 4px 8px; gap: 8px 12px; font-size: 11px; row-gap: 2px; }
    #ui-top .title, #build-id, #hint { display: none; }
    .stat { gap: 3px; }
    #zoom-ctl { gap: 5px; }
    #zoom-slider { width: 72px; }
    #speed-ctl button { padding: 3px 6px; font-size: 11px; }
    #right-ctl { gap: 8px; }
    #roster-panel { left: 6px; top: 92px; width: 46vw; max-height: 38vh; font-size: 11px; }
    #activity-panel { right: 6px; top: 92px; width: 40vw; max-height: 34vh; font-size: 11px; }
    #log-panel { left: auto; right: 6px; bottom: 8px; width: 52vw; max-height: 18vh; }
    #logs { max-height: 12vh; }
    #info-panel { max-width: 46vw; font-size: 11px; }
  }

  #info-panel {
    position: fixed; min-width: 175px; max-width: 250px;
    background: rgba(10, 13, 20, 0.94); border: 1px solid #2a3448; border-radius: 6px;
    padding: 8px 14px 8px 12px; color: #cfd6e4; font-size: 12px; z-index: 20;
    line-height: 1.8; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #info-panel.hidden { display: none; }

  #roster-panel {
    position: fixed; left: 12px; top: 54px; width: 186px; max-height: calc(100vh - 180px);
    background: rgba(10, 13, 20, 0.88); border: 1px solid #1c2333; border-radius: 6px;
    padding: 8px 6px; z-index: 9; overflow-y: auto; font-size: 12px; color: #aeb7c9;
  }
  #roster-panel::-webkit-scrollbar { width: 4px; }
  #roster-panel::-webkit-scrollbar-thumb { background: #2a3448; border-radius: 2px; }
  #roster-panel .roster-title { color: #e8d9a0; letter-spacing: 1px; margin: 0 0 4px 6px; }
  .roster-group-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 6px; border-radius: 4px; cursor: pointer; user-select: none;
  }
  .roster-group-head:hover { background: #161c2a; }
  .roster-group-head .cnt { color: #6b7688; }
  .roster-names { padding: 1px 0 3px 8px; }
  .roster-name { padding: 2px 6px; border-radius: 3px; cursor: pointer; }
  .roster-name:hover { background: #1c2333; color: #fff; }
  .roster-name.selected { color: #e8d9a0; }
  .roster-name .nat { color: #56617a; margin-left: 4px; }
  .roster-sec { color: #56617a; font-size: 11px; letter-spacing: 2px; margin: 6px 0 2px 6px; border-top: 1px solid #1c2333; padding-top: 6px; }
  .roster-res { padding: 2px 6px; color: #8f9ab0; }
  .roster-res b { color: #e8d9a0; font-variant-numeric: tabular-nums; }
  .roster-group-head .lv { color: #6b7688; font-size: 10px; }
  .fly-btn {
    cursor: pointer; color: #4a5f8a; padding: 1px 5px; border-radius: 3px;
    border: 1px solid #2a3448; font-size: 11px; user-select: none;
  }
  .fly-btn:hover { color: #fff; background: #2c3a58; border-color: #4a5f8a; }

  /* 世界动态面板：与左侧居民名册对称的右侧活动目录（样式沿用名册深色系） */
  #activity-panel {
    position: fixed; right: 12px; top: 54px; width: 170px; max-height: calc(100vh - 180px);
    background: rgba(10, 13, 20, 0.88); border: 1px solid #1c2333; border-radius: 6px;
    padding: 8px 6px; z-index: 9; overflow-y: auto; font-size: 12px; color: #aeb7c9;
  }
  #activity-panel::-webkit-scrollbar { width: 4px; }
  #activity-panel::-webkit-scrollbar-thumb { background: #2a3448; border-radius: 2px; }
  #activity-panel .panel-title { color: #e8d9a0; letter-spacing: 1px; margin: 0 0 4px 6px; }
  .act-row { padding: 2px 6px; border-radius: 3px; cursor: pointer; }
  .act-row:hover { background: #1c2333; color: #fff; }
  .act-row .cnt { color: #6b7688; font-variant-numeric: tabular-nums; }
  .act-row.zero { color: #4a5366; cursor: default; }
  .act-row.zero:hover { background: none; color: #4a5366; }

  /* 三面板折叠：标题可点击，collapsed 时仅隐藏内容区（标题常驻，▾/▸ 由 JS 同步） */
  #roster-panel .roster-title, #log-panel .log-title, #activity-panel .panel-title {
    cursor: pointer; user-select: none;
  }
  #roster-panel.collapsed #roster-body,
  #log-panel.collapsed #logs,
  #activity-panel.collapsed #activity-body { display: none; }

  #info-panel .ip-title { color: #e8d9a0; font-weight: 600; margin-bottom: 2px; }
  #info-panel .ip-bar { height: 5px; background: #1c2333; border-radius: 3px; overflow: hidden; margin: 3px 0 7px; }
  #info-panel .ip-bar > div { height: 100%; border-radius: 3px; }
  #info-close {
    position: absolute; top: 2px; right: 7px; background: none; border: none;
    color: #6b7688; cursor: pointer; font-size: 15px; padding: 0;
  }
  #info-close:hover { color: #fff; }
  #follow-btn {
    position: absolute; top: 2px; right: 24px; background: #161c2a; border: 1px solid #2a3448;
    color: #8f9ab0; border-radius: 3px; font-size: 10px; padding: 1px 6px; cursor: pointer;
  }
  #follow-btn:hover { color: #fff; border-color: #4a5f8a; }
  #follow-btn.active { background: #2c3a58; color: #e8d9a0; border-color: #4a5f8a; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui-top">
  <span class="title">小世界</span>
  <span class="stat"><span class="lab">人口</span><b id="stat-pop">0</b></span>
  <span class="stat"><span class="lab">存粮</span><b id="stat-food">0</b></span>
  <span class="stat"><span class="lab">房屋</span><b id="stat-houses">0</b></span>
  <span class="stat"><span class="lab">历法</span><b id="stat-date">1年1月</b><b id="stat-clock">--:--</b></span>
      <span class="stat"><span class="lab">时代</span><b id="stat-era">蛮荒时代</b></span>
      <span class="stat" id="rate-box" style="display:none"><span class="lab">实际速率</span><b id="stat-rate">--</b></span>
  <span id="build-id"></span>
  <div id="right-ctl">
    <div id="zoom-ctl">
      <span class="lab">缩放</span>
      <input type="range" id="zoom-slider" min="0.1" max="6" step="0.1" value="1.6">
      <b id="zoom-label">1.6×</b>
    </div>
    <div id="speed-ctl">
      <button id="go-home">回原点</button>
      <button id="pause" data-v="0">⏸ 暂停</button>
      <button id="s1" data-v="1" class="active">1×</button>
      <button id="s2" data-v="2">2×</button>
      <button id="s10" data-v="10">10×</button>
      <button id="s100" data-v="100">100×</button>
      <button id="s1000" data-v="1000">1000×</button>
      <button id="sfx-toggle">音效:开</button>
    </div>
  </div>
</div>

<div id="log-panel">
  <div class="log-title" id="log-title">▾ 世界纪事</div>
  <div id="logs"></div>
</div>

<div id="hint">拖拽平移 · 滚轮/滑轴缩放 · 空格暂停 · 1/2/3/4 变速 · 拖到虚空探索发现新大陆</div>

<div id="roster-panel">
  <div class="roster-title" id="roster-title">▾ 居民名册</div>
  <div id="roster-body"></div>
</div>

<div id="activity-panel">
  <div class="panel-title" id="activity-title">▾ 世界动态</div>
  <div id="activity-body"></div>
</div>

<div id="info-panel" class="hidden">
  <button id="info-close">×</button>
  <button id="follow-btn">跟随视角</button>
  <div id="info-body"></div>
</div>

<script>
/*__LOGIC__*/
/*__RENDER__*/
/*__MAIN__*/
</script>
</body>
</html>
